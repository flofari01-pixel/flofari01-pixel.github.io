<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V come Velociraptor</title>
<style>
:root{--bg:#eaf4ff;--card:#fff;--ink:#1d2b4a;--muted:#52627f;--line:#c9d6ea;--c1:#e63946;--c2:#2f6fed;--c3:#f59e0b;--c4:#22a06b;--btn:#e63946;--btn-ink:#fff;--sun:#ffc83d;
--font-display:"Arial Rounded MT Bold","Nunito",ui-rounded,"Trebuchet MS",system-ui,sans-serif;--font-body:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101a30;--card:#18264a;--ink:#f1f5ff;--muted:#a9b6d4;--line:#2c3d66;--c1:#ff6b76;--c2:#6aa0ff;--c3:#ffb84a;--c4:#4fd1a0;--btn:#ff6b76;--btn-ink:#1a0a0c;color-scheme:dark;}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
.app{max-width:520px;margin-inline:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.top{display:flex;gap:12px;align-items:stretch;}
.letter{flex:none;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:6px 16px 2px;font-family:var(--font-display);font-weight:900;color:var(--c1);font-size:clamp(3.4rem,17vw,5rem);line-height:1;cursor:pointer;display:flex;align-items:baseline;gap:10px;border-bottom:3px dashed var(--c2);}
.letter span:last-child{color:var(--c2);}
.word{flex:1;min-width:0;background:var(--card);border:3px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:6px 8px;font-family:var(--font-display);font-weight:900;font-size:clamp(1.25rem,6.2vw,2.2rem);letter-spacing:.02em;flex-wrap:nowrap;}
.back{align-self:flex-start;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;text-decoration:none;}
.back:focus-visible{outline:4px solid var(--c2);outline-offset:3px;}
.word{white-space:nowrap;}
.word span{-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;}
.word span:nth-child(4n+1){color:var(--c1);} .word span:nth-child(4n+2){color:var(--c2);} .word span:nth-child(4n+3){color:var(--c3);} .word span:nth-child(4n+4){color:var(--c4);}
.letter:focus-visible,.word:focus-visible,.stage:focus-visible,.go:focus-visible,.mute:focus-visible,input[type=range]:focus-visible{outline:4px solid var(--c2);outline-offset:3px;}
.pop{animation:pop .5s ease-out;} @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}
.stage{display:block;width:100%;padding:14px;box-sizing:border-box;border:0;background:var(--card);border-radius:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.stage img{display:block;width:100%;height:auto;border-radius:18px;}
.hop .subj{animation:hop .5s ease-out;} @keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-36px)}100%{transform:translateY(0)}}
.rolling .subj{transform-origin:50% 90%;animation:bump .32s ease-in-out infinite alternate;} @keyframes bump{from{transform:translateY(0) rotate(0)}to{transform:translateY(-9px) rotate(.7deg)}}
.caption{min-height:3.2rem;text-align:center;font-family:var(--font-display);font-weight:800;font-size:clamp(1.3rem,6vw,1.8rem);text-wrap:balance;display:flex;align-items:center;justify-content:center;}
.go{align-self:center;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;cursor:pointer;font-family:var(--font-display);font-weight:900;font-size:1.3rem;padding:16px 34px;min-height:60px;box-shadow:0 6px 0 rgba(0,0,0,.22);}
.go:active{transform:translateY(3px);}
.parents{border-top:2px solid var(--line);padding-top:12px;color:var(--muted);font-size:.9rem;line-height:1.5;}
.parents summary{cursor:pointer;font-weight:700;color:var(--ink);padding-block:6px;}
.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-block:10px;}
.ctrl label{font-weight:700;} .ctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--c2);}
.mute{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;}
.mute[aria-pressed="true"]{border-color:var(--btn);}
@media (prefers-reduced-motion: reduce){.hop .subj,.rolling .subj,.pop{animation:none;}}
</style></head>

  <div class="caption" id="caption" aria-live="polite">Tocca il Velociraptor!</div>

  <details class="parents"><summary>Per i genitori</summary>
    <div class="ctrl"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.05" value="0.5"><button class="mute" id="mute" type="button" aria-pressed="false">Silenzia</button></div>
    <p>Lettera V di «Impara l'alfabeto con... Lo straordinario mondo dei Dinosauri e dei rettili preistorici». Nessun cookie, nessuna registrazione, nessun dato raccolto. Consigliato con la presenza di un adulto.</p>

<script>
/* Audio definitivo: scrivi qui i percorsi dei file registrati (accanto alla pagina).
   Esempio: voice: "audio/a-come-allosauro.mp3". Finché sono null, la pagina usa la voce del browser e un effetto sintetico. */
var AUDIO = { voice: null, sound: null, letter: null, word: null };
var WORD = "VELOCIRAPTOR";
var NAME = "Velociraptor";
var CAP = "V come Velociraptor";
var stage=document.getElementById('stage'), caption=document.getElementById('caption'), volEl=document.getElementById('vol'), muteBtn=document.getElementById('mute');
var vol=0.5, muted=false, busy=false, ctx=null, current=[];
volEl.addEventListener('input',function(){vol=parseFloat(volEl.value);applyVolume();});
muteBtn.addEventListener('click',function(){muted=!muted;muteBtn.setAttribute('aria-pressed',String(muted));muteBtn.textContent=muted?'Riattiva audio':'Silenzia';applyVolume();});
function level(){return muted?0:vol;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function say(t){caption.textContent=t;}
function applyVolume(){current.forEach(function(a){a.volume=vol;a.muted=muted;});}
function playFile(src){return new Promise(function(resolve){var a=new Audio(src);a.volume=vol;a.muted=muted;current.push(a);function fin(){var i=current.indexOf(a);if(i>-1)current.splice(i,1);resolve();}a.onended=fin;a.onerror=fin;var p=a.play();if(p&&p.catch)p.catch(fin);});}
function speak(text,fb){return new Promise(function(resolve){var done=false;function fin(){if(!done){done=true;resolve();}}
  if(level()===0||!('speechSynthesis' in window)){setTimeout(fin,fb||1400);return;}
  try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=0.8;u.pitch=1.1;u.volume=level();
    var vs=window.speechSynthesis.getVoices();for(var i=0;i<vs.length;i++){if(vs[i].lang&&vs[i].lang.toLowerCase().indexOf('it')===0){u.voice=vs[i];break;}}
    u.onend=fin;u.onerror=fin;setTimeout(fin,4500);window.speechSynthesis.speak(u);}catch(e){setTimeout(fin,fb||1400);}});}
function roar(seconds){return new Promise(function(resolve){if(level()===0){setTimeout(resolve,seconds*1000);return;}
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();
    var osc=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;osc.type='sawtooth';
    osc.frequency.setValueAtTime(220,t);osc.frequency.linearRampToValueAtTime(90,t+seconds);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(level()*0.18,t+0.1);g.gain.linearRampToValueAtTime(0,t+seconds);
    osc.connect(g);g.connect(ctx.destination);osc.start(t);osc.stop(t+seconds+0.05);setTimeout(resolve,seconds*1000+200);}
  catch(e){setTimeout(resolve,seconds*1000);}});}
async function playAnimal(){if(busy)return;busy=true;stage.classList.add('hop');say(CAP);
  await(AUDIO.voice?playFile(AUDIO.voice):speak(CAP,1600));
  stage.classList.remove('hop');await sleep(200);stage.classList.add('rolling');say('Rrrr! Rrrr!');
  await(AUDIO.sound?playFile(AUDIO.sound):roar(1.6));
  stage.classList.remove('rolling');say("Tocca di nuovo " + "il " + NAME + "!");busy=false;}
async function playPart(el,text,file){if(busy)return;busy=true;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');say(text);await(file?playFile(file):speak(text,1000));busy=false;}
function fitWord(){var w=document.getElementById('word');w.style.fontSize='';var sz=parseFloat(getComputedStyle(w).fontSize);while(w.scrollWidth>w.clientWidth&&sz>12){sz-=1;w.style.fontSize=sz+'px';}}
fitWord(); window.addEventListener('resize',fitWord);
stage.addEventListener('click',playAnimal);
document.getElementById('go').addEventListener('click',playAnimal);
var letterEl=document.getElementById('letter'),wordEl=document.getElementById('word');
function onKey(fn){return function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}};}
var tapLetter=function(){playPart(letterEl,"V",AUDIO.letter);};
var tapWord=function(){playPart(wordEl,NAME,AUDIO.word);};
letterEl.addEventListener('click',tapLetter);letterEl.addEventListener('keydown',onKey(tapLetter));
wordEl.addEventListener('click',tapWord);wordEl.addEventListener('keydown',onKey(tapWord));
</script>
