<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Syria Kitty Bros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#0d0817;--fg:#f4f1ea;--accent:#ff7fb0;--accent-d:#a33a64;--hud:#ffd23f;--line:#2b1d4a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,sans-serif;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:12px "Press Start 2P",monospace;color:var(--accent);margin:0 auto 12px;max-width:768px;line-height:1.6;text-align:center}
#hud{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"lvl lives menu" "items prog prog";gap:6px 14px;align-items:center;font:8px "Press Start 2P",monospace;color:var(--hud);max-width:768px;margin:0 auto 10px;min-height:44px}
#hLvl{grid-area:lvl;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hLives{grid-area:lives;white-space:nowrap}
#hItems{grid-area:items;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;max-width:768px;margin:0 auto;aspect-ratio:4/3;background:#000;border:3px solid var(--line);border-radius:4px;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:rgba(8,4,18,.8);padding:12px}
.ov{align-items:safe center}
/* telefono in verticale (anche installato dall'icona): il menu occupa tutto lo schermo e scorre, senza tagliare titolo ed elenco */
@media (pointer:coarse) and (orientation:portrait){
  .ov{position:fixed;inset:0;z-index:20;background:#0d0817;padding:max(12px,env(safe-area-inset-top,0px)) 16px max(12px,env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
  .card{margin:auto 0}
}
@media (display-mode:standalone) and (orientation:portrait){ body{padding-top:max(36px,env(safe-area-inset-top,0px))} .ov{padding-top:max(44px,env(safe-area-inset-top,0px))} h1{font-size:10px;margin-bottom:8px} #hud{margin-bottom:6px} }
.ov[hidden]{display:none!important}
.card{text-align:center;max-width:460px;margin:auto}
.card h2{font:12px "Press Start 2P",monospace;color:var(--hud);margin:0 0 14px;line-height:1.7}
.card p{margin:0 0 18px;color:#e8e2ff}
button{font:9px "Press Start 2P",monospace;background:var(--accent);color:#1a0a14;border:0;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 var(--accent-d)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-d)}
button:focus-visible,#ov :focus,#menuBtn:focus{outline:3px solid var(--hud);outline-offset:3px}
#menuBtn{font-size:8px;padding:6px 8px;box-shadow:0 3px 0 var(--accent-d)}
.lvls{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:14px auto 0;width:240px;max-width:100%}
.lvls[hidden]{display:none!important}
#plBtn{display:block;margin:14px auto 12px;font-size:7px;padding:10px 10px}
#plPanel{margin-top:12px}
#plList{width:260px;max-width:100%;margin:0 auto;text-align:left}
#plList button{display:block;width:100%;margin:0 0 6px;text-align:left;font:12px/1.3 Inter,system-ui,sans-serif;padding:9px 10px;box-shadow:0 3px 0 var(--accent-d)}
#plBack{margin-top:12px}
#plPBack{margin-top:6px;font-size:7px;padding:7px 10px}
#plPlayer{margin-top:4px}
#plImg{display:block;width:112px;height:84px;max-width:100%;margin:0 auto;image-rendering:pixelated;border:2px solid var(--accent);background:#000}
#plName{font:11px/1.3 Inter,system-ui,sans-serif;margin:5px 0 0}
#plTime{font:11px Inter,system-ui,sans-serif;opacity:.8;margin:4px 0 0}
.plRow{display:flex;gap:5px;justify-content:center;align-items:center;margin-top:6px;flex-wrap:wrap}
.plRow button{font-size:7px;padding:6px 6px}
#plSeek{width:130px;max-width:100%;accent-color:var(--accent)}
.lvls button{font-size:7px;padding:8px 8px}
.hint{max-width:768px;margin:12px auto 0;color:#a79cc4;font-size:13px}
#pad{display:none;max-width:768px;margin:12px auto 0;justify-content:space-between;align-items:center;gap:10px}
#pad .cl{display:grid;gap:6px}
#pad .dpad{grid-template-areas:". u ." "l c r" ". d .";grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:0}
#pad .faces{grid-template-areas:". x ." "y . a" ". b .";grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}
#pad button{padding:0;font-size:9px;touch-action:none;user-select:none;box-shadow:0 3px 0 #1b1424}
#pad .dpad{filter:drop-shadow(0 3px 0 #1b1424)}
#pad .dpad button,#pad .ctr{background:#3a2d4d;color:#f4e9ff;box-shadow:none}
#pad .dpad [data-k="u"]{border-radius:6px 6px 0 0}#pad .dpad [data-k="d"]{border-radius:0 0 6px 6px}#pad .dpad [data-k="l"]{border-radius:6px 0 0 6px}#pad .dpad [data-k="r"]{border-radius:0 6px 6px 0}
#pad .ctr{grid-area:c}
#pad .lcol{position:relative;display:flex;flex-direction:column;align-items:flex-start}
#pad [data-k="p"]{position:absolute;bottom:100%;margin-bottom:20px;left:0;width:64px;height:24px;font-size:7px;padding:0;background:#3a2d4d;color:#f4e9ff;box-shadow:0 3px 0 #1b1424;border-radius:6px}
#pad .faces button{background:var(--accent);color:#1a0a14;border-radius:50%}
#pad [data-k="u"]{grid-area:u}#pad [data-k="l"]{grid-area:l}#pad [data-k="r"]{grid-area:r}#pad [data-k="d"]{grid-area:d}
#pad [data-k="x"]{grid-area:x}#pad [data-k="y"]{grid-area:y}#pad [data-k="a"]{grid-area:a}#pad [data-k="b"]{grid-area:b}
.arrows{display:flex;gap:10px;flex:2}
@media (pointer:coarse){#pad{display:flex}}
#resWrap{max-width:768px;margin:12px auto 0;display:flex;justify-content:flex-end}
#resIco{width:26px;height:26px;image-rendering:pixelated}
#resBtn{position:relative;width:56px;height:56px;border-radius:50%;padding:0;font-size:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 var(--accent-d);touch-action:manipulation}
#resBtn b{font-size:12px}
#resBtn:disabled{opacity:.45;cursor:default}
#shootTip{min-height:12px;max-width:768px;margin:8px auto 0;font:8px "Press Start 2P",monospace;color:var(--hud);text-align:left}
#prog{position:relative;grid-area:prog;justify-self:end;width:120px;height:8px;background:var(--line);border:2px solid var(--accent);margin:4px 12px 4px auto;order:2}
#hItems{order:1}
#menuBtn{grid-area:menu;order:3}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
#progMe{position:absolute;top:-5px;width:4px;height:14px;background:#fff;transform:translateX(-50%)}
#progFlag{position:absolute;top:-5px;width:4px;height:14px;background:var(--hud);transform:translateX(-50%);display:none}
#progEnd{position:absolute;right:-6px;top:-5px;width:4px;height:14px;background:#9aff9a}
/* telefono in orizzontale: gioco a tutto schermo al centro, comandi sulle due barre laterali */
@media (pointer:coarse) and (orientation:landscape) and (max-height:600px){
  html,body{height:100%;overflow:hidden}
  body{padding:0;background:#000}
  h1,.hint{display:none}
  #shootTip{display:none!important}
  #stage{position:fixed;inset:0;max-width:none;margin:0;aspect-ratio:auto;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:1}
  canvas{width:auto;height:100vh;height:100dvh;max-width:100%;aspect-ratio:4/3}
  #hud{position:fixed;left:8px;top:6px;z-index:6;width:150px;max-width:none;margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:6px}
  #prog{margin:4px 0}
  #pad{display:flex;position:fixed;inset:0;margin:0;max-width:none;pointer-events:none;z-index:6}
  #pad .lcol{position:absolute;left:10px;bottom:24px;pointer-events:auto}
  #pad .faces{position:absolute;right:10px;bottom:18px;pointer-events:auto;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px)}
  #pad .dpad{grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px)}
  #pad [data-k="p"]{width:56px;height:20px;font-size:6px}
  #pad button{font-size:8px}
  #resWrap{position:fixed;right:10px;top:50px;margin:0;max-width:none;z-index:6}
  #resBtn{width:64px;height:64px;font-size:6px;gap:3px}
  #resBtn b{font-size:10px}
  #resIco{width:22px;height:22px}
}
/* telefono in verticale: comandi subito sotto il testo, a larghezza piena */
@media (pointer:coarse) and (orientation:portrait){
  .hint{display:none}
  #pad{margin:-6px auto 0;padding:0}
  #resWrap{margin-bottom:12px}
}
</style>

if('serviceWorker' in navigator){

<body>
<h1>Syria Kitty Bros</h1>
<div id="hud"><span id="hLvl"></span><span id="hLives"></span><div id="prog" title="Quanto manca al traguardo"><div id="progFill"></div><div id="progFlag"></div><div id="progMe"></div><div id="progEnd"></div></div><span id="hItems"></span><button id="menuBtn" type="button">MENU</button></div>
<div id="stage">

  <div id="ov" class="ov" hidden>
    <div class="card">
      <h2 id="ovT"></h2>

<p class="hint">Frecce o A / D per muoverti, Spazio o W per saltare, GIÙ dopo il salto per il salto mortale, X per sparare, Z per correre, R per usare la riserva, P per la pausa.</p>
<div id="pad">
  <div class="lcol">
    <button type="button" data-k="p">PAUSA</button>

    <button type="button" data-k="u">&#9650;</button>

    <button type="button" data-k="r">&#9654;</button>
    <button type="button" data-k="d">&#9660;</button>
  </div>
  </div>

    <button type="button" data-k="x">X</button>

</div>
<script>
/* ---------- COSTANTI E SPRITE ---------- */
const W=256,H=192,T=16,G=0.42,JUMP=-7.6,SPEED=1.9,MAXFALL=7;
const cv=document.getElementById('c');
let g=cv.getContext('2d'); // let: la riserva disegna il suo piccolo sprite cambiando contesto
g.imageSmoothingEnabled=false;
// lo sfondo si disegna a risoluzione tripla su un canvas nascosto e poi si riduce con l'interpolazione: scorrimento fluido
const bgC=document.createElement('canvas'); bgC.width=W*3; bgC.height=H*3;
const bgG=bgC.getContext('2d');
const PAL={k:'#140a0c',w:'#ffffff',p:'#ff7fb0',r:'#d62828',y:'#ffd23f',B:'#8a4b22',b:'#c9854a',D:'#4a2412',u:'#3a6fd8',a:'#4cc9f0'};
const KITTY=[
"..k........k..",
".kwk......kwk.",
".kwwkkkkkkwwk.",
".kwwwwwwwwwwk.",
"k"+"w".repeat(12)+"k",
"k"+"ww"+"kk"+"wwww"+"kk"+"ww"+"k",
"k"+"ww"+"kk"+"wwww"+"kk"+"ww"+"k",
"k"+"w".repeat(6)+"yy"+"w".repeat(4)+"k",
".kwwwwwwwwwwk.",
".kwww"+"k".repeat(5)+"wwk.",
"..k"+"p".repeat(7)+"k...",
".k"+"p".repeat(10)+"k.",
"kw"+"p".repeat(10)+"wk",
"kww"+"p".repeat(8)+"wwk",
"kww"+"k".repeat(8)+"wwk",
"..kwwk..kwwk.."
];
const KB=KITTY.map((r,j)=>(j>=3&&j<=8)?r:r.replace(/w/g,'B').replace(/p/g,'b'));
const KR=KITTY.map(r=>r.replace(/p/g,'r'));
// il gattino maschio che aspetta la gattina sotto il traguardo: vestito di blu
const KBOY=KITTY.map(r=>r.replace(/p/g,'u'));
// gattina di profilo, rivolta a destra (a sinistra si specchia); i piedi stanno sull'ultima riga
const PSIDE=[
"......kk........",
".....kwwk.......",
"..kkkkkkkkkkkk..",
"..kwwwwwwwwwwk..",
".kwwwwwwwwwwwwk.",
".kwwwwwwww"+"kk"+"wwk.",
".kwwwwwwww"+"kk"+"wwk.",
".kwwwwwwwwwwwyk.",
".kwwwwwwwwwwwwk.",
"..kwwwwwwwwwwk..",
".....kkkkkk.....",
"....k"+"p".repeat(6)+"k....",
"....k"+"p".repeat(6)+"k....",
"....k"+"p".repeat(4)+"k......",
"....kwwk........",
"....kwwwwk......"
];
const KBS=PSIDE.map(r=>r.replace(/w/g,'B').replace(/p/g,'b'));
const KRS=PSIDE.map(r=>r.replace(/p/g,'r'));
// parti del profilo che si muovono: braccio (con manina bianca) e gamba (bianca)
const PARM=["pk","pp","pp","ww"];
const PLEG=["wk","wk","wk","wwk"];
// orsetto di profilo: testa marrone, ma il viso è bianco perché indossa il cappuccio
const BHEAD=PSIDE.map((r,i)=>r.split('').map((c,x)=>{
  if(c==='p') return 'b';
  if(c!=='w') return c;
  return (i>=5&&i<=9&&x>=7)?'w':'B';
}).join(''));
const VAR={
 kitty:{body:PSIDE, arm:PARM, leg:PLEG},
 bear:{body:BHEAD, arm:PARM.map(r=>r.replace(/w/g,'B').replace(/p/g,'b')), leg:PLEG.map(r=>r.replace(/w/g,'B'))},
 dress:{body:PSIDE.map(r=>r.replace(/p/g,'r')), arm:PARM.map(r=>r.replace(/p/g,'r')), leg:PLEG}
};
// tuta mimetica: con il casco la gattina indossa una tuta a macchie verdi e marroni al posto del rosa
const CAMO_CH=['g','G','B','q','g','G','q','B'];
function camoRows(rows){ return rows.map((r,y)=>r.split('').map((c,x)=>c==='p'?CAMO_CH[(x*3+y*5+((x*y)%4))%8]:c).join('')); }
const CAMO_F=camoRows(KITTY);
VAR.camo={body:camoRows(PSIDE), arm:camoRows(PARM), leg:camoRows(PLEG)};
// vestiti per livello: quando la gattina prende l'oggetto che le dà i poteri, il suo vestito cambia
// (indice = livello - 1; top sopra la vita, bottom sotto; i livelli senza voce restano invariati)
Object.assign(PAL,{N:'#9c6b3f',A:'#3d4149',J:'#2f4a7a',C:'#eed5a0',Q:'#fff3d6'}); // nocciola, antracite, jeans, crema (più caldo del bianco)
const OUTFIT=[];
OUTFIT[1]={top:'r',hat:true};         // 2: rosso con cappello da Babbo Natale
OUTFIT[2]={top:'C'};                  // 3: crema
OUTFIT[3]={top:'S'};                  // 4: grigio
OUTFIT[4]={top:'N'};                  // 5: nocciola
OUTFIT[5]={top:'A'};                  // 6: grigio antracite
OUTFIT[6]={top:'N'};                  // 7: nocciola
OUTFIT[7]={top:'N'};                  // 8: nocciola
OUTFIT[8]={top:'r'};                  // 9: rosso
OUTFIT[9]={top:'Q',bottom:'J'};       // 10: maglietta panna e jeans
OUTFIT[10]={top:'k'};                 // 11: nero
OUTFIT[11]={top:'r'};                 // 12: rosso
OUTFIT[12]={top:'y'};                 // 13: giallo
OUTFIT[13]={top:'w'};                 // 14: bianco
OUTFIT[14]={top:'C',bottom:'S'};      // 15: maglietta crema, gonna grigia
OUTFIT[15]={top:'v'};                 // 16: viola
OUTFIT[16]={bikini:true};              // 17: bikini (due pezzi)
OUTFIT[17]={top:'r',hat:true};         // 18: rosso con cappello da Babbo Natale
OUTFIT[19]={top:'N'};                 // 20: nocciola
OUTFIT[20]={bikini:true};              // 21: bikini (due pezzi)
// le parti rosa del corpo diventano del colore scelto (metà alta = top, metà bassa = bottom)
function dressRows(rows,top,bottom){
  let lo=99,hi=-1; rows.forEach((r,y)=>{ if(r.includes('p')){ lo=Math.min(lo,y); hi=Math.max(hi,y); } });
  const mid=(lo+hi)/2;
  return rows.map((r,y)=>r.split('').map(c=>c==='p'?((y<=mid)?top:(bottom||top)):c).join(''));
}
// bikini a due pezzi: reggiseno e slip rossi, con una striscia di pelle bianca in mezzo
function bikiniRows(rows){
  let lo=99; rows.forEach((r,y)=>{ if(r.includes('p')) lo=Math.min(lo,y); });
  return rows.map((r,y)=>r.split('').map(c=>{
    if(c!=='p') return c;
    if(y<=lo+1) return 'r';          // reggiseno
    if(y===lo+2) return 'w';         // pelle tra i due pezzi
    return 'r';                      // slip
  }).join(''));
}
const OUT_CACHE={};
function outfitSet(o){
  const key=o.bikini?'bikini':o.top+'|'+(o.bottom||'');
  if(!OUT_CACHE[key]) OUT_CACHE[key]=o.bikini
    ? {front:bikiniRows(KITTY), side:bikiniRows(PSIDE), arm:dressRows(PARM,'r','r'), leg:PLEG}
    : {front:dressRows(KITTY,o.top,o.bottom), side:dressRows(PSIDE,o.top,o.bottom), arm:dressRows(PARM,o.top,o.bottom), leg:PLEG};
  return OUT_CACHE[key];
}
const BOW=[[11,0],[12,0],[13,0],[11,1],[12,1],[13,1],[12,2],[13,2]];
const TEDDY=[
".kk....kk.",
"kBBk..kBBk",
"kBBBkkBBBk",
"kBBBBBBBBk",
"kBkBBBBkBk",
"kBBBBDBBBk",
"kBBBBBBBBk",
".kBBBBBBk.",
".kBBkkBBk.",
"..kk..kk.."
];
const HEART=[".xx...xx.","xxxx.xxxx","xxxxxxxxx","xxxxxxxxx",".xxxxxxx.","..xxxxx..","...xxx...","....x...."];
const STAR=["..y..","yyyyy",".yyy.","yy.yy","y...y"];

// oggetti da collezionare (contano nel conteggio) e oggetti potenziatori (fanno crescere la gattina)
const POWER=['bear','umbrella','tree'];
const COLL={
 pop:{c:'#fff3c4',l:'POP CORN'}, ball:{c:'#d62828',l:'PALLINE'}, heart:{c:'#ff4f8b',l:'CUORI'},
 star:{c:'#ffe066',l:'STELLE'}, shell:{c:'#f7d6b8',l:'CONCHIGLIE'}, meat:{c:'#8a4b22',l:'POLPETTE'},

/* ---------- GENERATORE DI LIVELLI ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genLayout(seed,coll,pw,len=170,split=90){
  const R=mulberry32(seed);
  const ground=[]; let x=0;
  while(x<len){ const l=12+Math.floor(R()*8); const e=Math.min(x+l,len); ground.push([x,e]); x=e+3; }
  ground.push([Math.min(x,len+4),len+12]);
  const plats=[];
  for(const [a,b] of ground){
    if(b-a>12 && R()<0.7){ const w=3+Math.floor(R()*3); const px=a+2+Math.floor(R()*Math.max(1,b-a-w-3)); plats.push([px,R()<0.5?7:8,w]); }
  }
  const pick=()=>{ const s=ground[Math.floor(R()*ground.length)]; return s[0]+2+Math.floor(R()*Math.max(1,s[1]-s[0]-4)); };
  // le caselle non stanno mai sopra una mensola: così si possono colpire da sotto
  const platCols=new Set(); for(const [px,,w] of plats) for(let k=0;k<w;k++) platCols.add(px+k);
  const pickBox=()=>{ let x,k=0; do{ x=pick(); k++; }while(platCols.has(x)&&k<50); return x; };
  // oggetti da trovare: al massimo 4 per livello, molto distanziati tra loro
  const findXs=[];
  const pickFind=()=>{ let x,k=0; do{ x=pick(); k++; }while((platCols.has(x)||findXs.some(f=>Math.abs(f-x)<14))&&k<300); findXs.push(x); return x; };
  const boxes=[], items=[], enemies=[];
  if(coll.length){
    // ogni metà del livello ha le sue caselle (così dopo la bandierina si trova di nuovo tutto):
    // un cioccolato, oggetti da trovare (sempre dopo il cioccolato) e oggetti da raccogliere
    const find=coll[coll.length-1], collect=coll.slice(0,-1);
    const nFind=Math.min(find[1],3); // 3 oggetti da trovare per livello
    // mai nei primi 30 tratti del livello, e mai due caselle consecutive
    const halves=split>0?[[30,split],[split,len]]:[[10,len]];
    const H=halves.length;
    // cioccolato e oggetti da trovare: mai due di loro a meno di 14 tratti l'uno dall'altro
    const specials=[];
    const groundOK=x=>ground.some(([a,b])=>x>=a+2&&x<b-2);
    // posizioni libere in [lo,hi): sul terreno, non sopra una mensola, non affiancate, lontane almeno "gap" dagli speciali
    const cands=(lo,hi,gap)=>{ const out=[]; for(let x=Math.max(0,lo);x<hi;x++){ if(!groundOK(x)||platCols.has(x)) continue; if(boxes.some(b=>Math.abs(b[0]-x)<=1)) continue; if(specials.some(s=>Math.abs(s-x)<gap)) continue; out.push(x); } return out; };
    const inRange=(lo,hi)=>{ let c=cands(lo,hi,14); if(!c.length) c=cands(lo,hi,8); if(!c.length) c=cands(lo,hi,0); if(!c.length) return pick(); return c[Math.floor(R()*c.length)]; };
    const special=(lo,hi,t,f)=>{ const x=inRange(lo,hi); specials.push(x); boxes.push([x,6,t,f]); return x; };
    // sistema in ordine (x crescenti, distanza di almeno 14) cioccolati e oggetto da trovare della metà
    const placeSeq=(lo,hi,seq)=>{
      const n=seq.length;
      for(let tries=0;tries<500;tries++){
        const xs=[]; let prev=lo-14, ok=true;
        for(let k=0;k<n&&ok;k++){
          const r=n-1-k, a=Math.max(lo,prev+14), b=hi-14*r;
          const c=[];
          for(let x=a;x<b;x++) if(groundOK(x)&&!platCols.has(x)&&!boxes.some(q=>Math.abs(q[0]-x)<=1)&&!specials.some(s=>Math.abs(s-x)<14)) c.push(x);
          if(!c.length){ ok=false; break; }
          prev=c[Math.floor(R()*c.length)]; xs.push(prev);
        }
        if(ok){ xs.forEach((x,k)=>{ specials.push(x); boxes.push([x,6,seq[k][0],seq[k][1]]); }); return; }
      }
      // ripiego se non c'è spazio: posizioni più vicine possibile
      let prev=lo-14; seq.forEach(([t,f])=>{ prev=special(Math.max(lo,prev+14),hi,t,f); });
    };
    let ci=0;
    halves.forEach(([lo,hi],hIdx)=>{
      const nf=Math.floor(nFind/H)+(hIdx===H-1?nFind%H:0);
      // in ordine lungo la metà: 2 barrette di cioccolato, poi gli oggetti da trovare
      const nch=H>1?(hIdx===0?2:1):1; // al massimo 3 cioccolati per livello
      const seq=[]; for(let c=0;c<nch;c++) seq.push(['choc',false]);
      for(let j=0;j<nf;j++) seq.push([find[0],true]);
      placeSeq(lo,hi,seq);
      const nc=Math.ceil(Math.max(3,nFind)/H);
      for(let j=0;j<nc;j++){ const x=inRange(lo,hi); boxes.push([x,6,collect.length?collect[ci%collect.length][0]:'pop',false]); ci++; }
    });
    // oggetti da raccogliere: sparsi nel livello, mai sulla colonna di una casella
    const boxCols=new Set(boxes.map(b=>b[0]));
    for(const [t,n] of collect) for(let i=0;i<n;i++){
      let x,k=0; do{ x=pick(); k++; }while(boxCols.has(x)&&k<50);
      items.push([t,x,R()<0.3?5:6]);
    }
  }
  for(let i=0;i<4;i++){ let ex; do{ ex=pick(); }while(ex<12||ex>len-10); enemies.push(ex); }
  return {ground,plats,boxes,items,enemies};
}

// ruote del quad: due fotogrammi (raggi a croce e a X) che si alternano mentre il quad avanza
function spinWheels(rows,phase){
  const r=rows.map(s=>s.split(''));
  for(const cx of [6,21]){
    for(let y=9;y<=11;y++) for(let x=cx-2;x<=cx+2;x++) if(r[y][x]==='S') r[y][x]='k';
    const cells=phase===0 ? [[9,cx],[10,cx-1],[10,cx],[10,cx+1],[11,cx]] : [[9,cx-1],[9,cx+1],[10,cx],[11,cx-1],[11,cx+1]];
    for(const [y,x] of cells) r[y][x]='S';
  }
  return r.map(a=>a.join(''));
}

function loadLevel(i){
  lvlIdx=i; L=LV[i];
  musicPlay(i); // musica del livello
  const lay=L.gen?genLayout(L.seed,L.coll,L.pw):L;
  tiles=new Map(); boxes=[]; items=[]; enemies=[]; rain=[];
  umbrella=false; big=false; powered=false; redDress=false; heldType=null; helmet=false; reserve=[]; dropFx=null; shots=[]; shootOn=false; shotCool=0; findLeft=3;
  cnt={}; tot={}; collTot=0; cam=0; hitCool=0; jumpBuf=0; wet=0;
  for(const [a,b] of lay.ground) for(let x=a;x<b;x++) for(let y=10;y<12;y++) tiles.set(x+','+y,'g');
  for(const [x,y,w] of lay.plats) for(let k=0;k<w;k++) tiles.set((x+k)+','+y,'p');
  for(const [x,y,t,f] of lay.boxes){
    tiles.set(x+','+y,'b');
    // f=true: la casella fa uscire un oggetto da trovare; altrimenti uno da raccogliere
    boxes.push({x,y,t,used:false,find:f!==undefined?f:!COLL[t]});
    if(COLL[t]||FIND.has(t)) tot[t]=(tot[t]||0)+1;
  }
  const fb=boxes.find(b=>b.find&&b.t!=='choc'); levelFind=fb?fb.t:'bear';
  for(const [t,x,y] of lay.items){ items.push({t,x:x*T+3,y:y*T+3,got:false,c:items.length%5}); tot[t]=(tot[t]||0)+1; }
  for(const x of lay.enemies) enemies.push({x:x*T,y:146,w:14,h:14,vy:0,dir:-1,onG:false,dead:false});
  pl={x:32,y:144,w:12,h:16,vx:0,vy:0,onG:false,face:1,coyote:0,flipT:0,flipUsed:false};
  // bandierina a metà livello: se si muore si riparte da lì
  flag=null; const mid=Math.floor(L.w/2);
  for(let d=0;d<60&&!flag;d++) for(const tx of [mid+d,mid-d]){
    if(!flag && tiles.get(tx+',10')==='g' && !tiles.has(tx+',9')) flag={x:tx*T,y:10*T-16,reached:false};
  }
  // oggetti da trovare (3): il primo dopo i primi due quinti, uno fisso alla bandierina a metà, uno un po' dopo
  {
    const fbs=boxes.filter(b=>b.find&&b.t!=='choc');
    if(fbs.length){
      const ft=fbs[0].t;
      for(const b of fbs){ tiles.delete(b.x+','+b.y); tot[b.t]=(tot[b.t]||0)-1; }
      boxes=boxes.filter(b=>!(b.find&&b.t!=='choc'));
      const door=L.door;
      const spot=(want,ok2=()=>true)=>{
        // cerca vicino a 'want' su tutto il livello (prima le posizioni più vicine)
        for(let d=0;d<=door;d++) for(const x of [want+d,want-d]){
          if(x<3||x>door-4||tiles.get(x+',10')!=='g') continue;
          let free=true; for(let r=5;r<=9;r++) if(tiles.has(x+','+r)){ free=false; break; }
          if(!free||boxes.some(b=>Math.abs(b.x-x)<=2)||!ok2(x)) continue;
          return x;
        }
        return want;
      };
      // tra due oggetti da trovare ci sono almeno 3 tratti: mai due caselle consecutive
      const taken=[];
      // tra due oggetti che danno poteri ci devono essere almeno 2 caselle (di qualsiasi tipo): mai due caselle di potere di fila
      const far=(x)=>{
        const M=[...boxes.map(b=>({x:b.x,p:false})),...taken.map(t=>({x:t,p:true})),{x,p:true}].sort((a,b)=>a.x-b.x);
        let last=-1;
        for(let i=0;i<M.length;i++){ if(!M[i].p) continue; if(last>=0&&i-last-1<2) return false; last=i; }
        return true;
      };
      const spot2=(want)=>{ const x=spot(want,far); taken.push(x); return x; };
      const x1=spot2(Math.round(door*0.42));
      const x2=flag?spot2(Math.floor(flag.x/T)):spot2(Math.floor(L.w/2));
      const x3=spot2(x2+12);
      const xs=[x1,x2,x3].slice(0,Math.min(3,fbs.length));
      for(const x of xs){ boxes.push({x,y:6,t:ft,used:false,find:true}); tiles.set(x+',6','b'); tot[ft]=(tot[ft]||0)+1; }
      levelFind=ft;
    }
  }
  // nessun oggetto da raccogliere dentro o sotto una casella (dopo lo spostamento degli oggetti da trovare):
  // se capita, lo si sposta di qualche tratto; se non c'è spazio, non compare
  {
    const boxAt=(tx,ty)=>tiles.get(tx+','+ty)==='b'||boxes.some(b=>b.x===tx&&Math.abs(b.y-ty)<=1);
    for(let n=items.length-1;n>=0;n--){
      const it=items[n]; const ty=Math.round((it.y-3)/T); let tx=Math.round((it.x-3)/T);
      if(!boxAt(tx,ty)) continue;
      let ok=false;
      for(let d=2;d<=12&&!ok;d+=1){ for(const c of [tx+d,tx-d]){ if(!boxAt(c,ty)&&tiles.get(c+',10')==='g'){ it.x=c*T+3; ok=true; break; } } }
      if(!ok){ items.splice(n,1); tot[it.t]=(tot[it.t]||0)-1; }
    }
  }
  // pipistrelli (nella zucca) e gabbiani (nei livelli di mare): volano da destra a sinistra, su e giù
  const fk=L.end==='pumpkin'?'bat':((TH[L.th]&&TH[L.th].deco==='sea')?'bird':null);
  if(fk){
    const R2=mulberry32((L.seed||(lvlIdx+1)*97)+555), n=fk==='bat'?6:4;
    for(let k=0;k<n;k++){
      // a volte volano all'altezza della testa della gattina quando è grande, altre volte più in alto
      const low=k===1||R2()<0.4; const base=low?131+R2()*2:96+R2()*24; // almeno un volatile basso per livello, all'altezza della faccia da grande // a volte bassi, sotto la testa della gattina piccola; altre volte più in alto
      enemies.push({fly:fk,x:40+k*((L.door*T)-80)/n+R2()*30,y:base,base,amp:low?2:6,t:R2()*6.28,spd:0.7+R2()*0.5,ft:0,w:12,h:10,vy:0,dir:-1,onG:false,dead:false});
    }
  }
  updateHUD();
}

  const el=document.getElementById('prog'); if(!el||!L||!pl) return;

function plCtx(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state!=='running') AC.resume().catch(()=>{}); return AC; }
// screen del livello: disegna il livello in una tela nascosta, poi ripristina il menu
function levelShot(i){
  if(plPrev[i]!==undefined) return plPrev[i];
  const pc=document.createElement('canvas'); pc.width=W; pc.height=H;
  const saved=g; g=pc.getContext('2d'); g.imageSmoothingEnabled=false;
  try{ loadLevel(i); draw(); plPrev[i]=pc.toDataURL(); }
  catch(e){ plPrev[i]=''; }
  finally{ g=saved; loadLevel(0); }
  return plPrev[i];
}
async function plFetch(i){
  if(plBufs[i]) return plBufs[i];
  const r=await fetch('musica/livello_'+(i+1)+'.mp3');
  const buf=await plCtx().decodeAudioData(await r.arrayBuffer());
  // salta il silenzio iniziale: primo campione udibile (con 50 ms di margine)
  let first=buf.length;
  for(let c=0;c<buf.numberOfChannels;c++){
    const d=buf.getChannelData(c);
    for(let k=0;k<first;k++){ if(Math.abs(d[k])>0.01){ first=k; break; } }
  }
  const trim=Math.max(0,first/buf.sampleRate-0.05);
  plBufs[i]={buf,trim};
  // tiene in memoria solo le ultime canzoni usate (le decodifiche sono pesanti)
  plOrder.push(i);
  while(plOrder.length>3){ const old=plOrder.shift(); if(old!==plCur) plBufs[old]=undefined; else plOrder.push(old); }
  return plBufs[i];
}
function plDur(){ return plBuf? plBuf.duration-plTrim : 0; }
function plPos(){
  if(!plSrc) return plOff;
  let t=plCtx().currentTime-plT0;
  const d=plDur();
  if(d>0) t = plLoopOn ? t%d : Math.min(t,d);
  return t;
}
function plStopSrc(){
  if(plSrc){ const s=plSrc; plSrc=null; s.onended=null; try{ s.stop(); }catch(e){} }
}
function plStartAt(t){
  plStopSrc();
  const src=plCtx().createBufferSource();
  src.buffer=plBuf; src.loop=plLoopOn; src.loopStart=plTrim; src.loopEnd=plBuf.duration; src.connect(AC.destination);
  src.onended=()=>{ if(plSrc===src){ plSrc=null; plOff=0; if(plCur<SONGS.length-1) plGo(1); else updatePlUI(); } }; // a fine canzone parte la successiva
  src.start(0,plTrim+t); plSrc=src; plT0=AC.currentTime-t; updatePlUI();
}
function fmtT(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updatePlUI(){
  const d=plDur(), t=plPos();
  const seek=document.getElementById('plSeek');
  seek.max=d||100;
  if(document.activeElement!==seek) seek.value=t;
  document.getElementById('plTime').textContent=fmtT(t)+' / '+fmtT(d);
  document.getElementById('plPlay').textContent=plSrc?'❚❚':'▶';
  document.getElementById('plLoop').textContent='LOOP: '+(plLoopOn?'SÌ':'NO');
}
setInterval(()=>{ if(!document.getElementById('plPlayer').hidden) updatePlUI(); },250);
async function plLoad(i,play){
  plCur=i; plStopSrc(); plOff=0;
  document.getElementById('plName').textContent=(i+1)+'. '+SONGS[i];
  document.getElementById('plImg').src=levelShot(i);
  const {buf,trim}=await plFetch(i);
  if(plCur!==i) return; // nel frattempo si è scelta un'altra canzone
  plBuf=buf; plTrim=trim;
  if(play) plStartAt(0); else updatePlUI();
}
function plPlayPause(){ if(plSrc){ plOff=plPos(); plStopSrc(); updatePlUI(); } else if(plBuf) plStartAt(plOff); }
function plStop(){ plStopSrc(); plOff=0; updatePlUI(); }
function plGo(d){ const n=Math.max(0,Math.min(SONGS.length-1,plCur+d)); plLoad(n,true); }
function plSeekTo(s){
  const t=Math.max(0,Math.min(plDur(),s));

/* ---------- COLLISIONI ---------- */
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function resolveX(e,s){
  const ty0=Math.floor(e.y/T), ty1=Math.floor((e.y+e.h-1)/T);
  const tx0=Math.floor(e.x/T), tx1=Math.floor((e.x+e.w-1)/T);
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    if(!tiles.has(tx+','+ty)) continue;
    if(s>0) e.x=tx*T-e.w; else e.x=(tx+1)*T;
    return true;
  }
  return false;
}
function resolveY(e){
  const tx0=Math.floor(e.x/T), tx1=Math.floor((e.x+e.w-1)/T);
  const ty0=Math.floor(e.y/T), ty1=Math.floor((e.y+e.h-1)/T);
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    if(!tiles.has(tx+','+ty)) continue;
    if(e.vy>0){ e.y=ty*T-e.h; e.vy=0; e.onG=true; }
    else {
      e.y=(ty+1)*T; e.vy=0;
      if(e===pl && tiles.get(tx+','+ty)==='b') hitBox(tx,ty);
    }
    return true;
  }
  return false;
}
// cosa esce da una casella: quelle del cioccolato danno il cioccolato se si è piccole,
// e l'oggetto da trovare del livello se si è grandi
// gli oggetti da trovare sono 3 in tutto nel livello (findLeft); se finiscono, la casella è vuota
function boxItem(b){
  // il cioccolato resta cioccolato: gli oggetti da trovare sono già nelle caselle prestabilite del livello
  if(b.t==='choc') return {t:'choc',find:false};
  if(b.find){
    if(findLeft>0){ findLeft--; return {t:b.t,find:true}; }
    return null;
  }
  return {t:b.t,find:false};
}
function hitBox(tx,ty){
  sfx('bump');
  const b=boxes.find(q=>q.x===tx&&q.y===ty);
  if(!b||b.used) return;
  b.used=true; tiles.set(tx+','+ty,'u');
  const bi=boxItem(b);
  if(bi) items.push({t:bi.t,x:tx*T+3,y:(ty-1)*T+3,got:false,c:items.length%5,find:bi.find});
}

function sfx(k){
  try{
    unlockAudio();
    if(!AC||AC.state!=='running') return;
    let t=AC.currentTime;
    musicDuck();
    for(const [f,d,ty,f2] of SFX[k]){
      const o=AC.createOscillator(), gn=AC.createGain();
      o.type=ty||'square';
      o.frequency.setValueAtTime(f,t);
      if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
      gn.gain.setValueAtTime(0.12,t);
      gn.gain.exponentialRampToValueAtTime(0.001,t+d);
      o.connect(gn); gn.connect(AC.destination);
      o.start(t); o.stop(t+d);
      t+=d;
    }
  }catch(e){}
}
/* ---------- MUSICA DI SOTTOFONDO: una traccia per livello (primi 11), in loop ---------- */
// i file stanno in musica/livello_N.mp3 accanto alla pagina; il volume della musica si abbassa
// per un attimo a ogni suono del gioco, così gli effetti si sentono sempre
const MUS_VOL=0.55, MUS_DUCK=0.4; // musica quasi piena; si abbassa solo un attimo sotto i suoni
const MUS_TRACKS=21;
let musGain=null, musSrc=null, musCur=-1, musCache={}, musWant=0;
function musicOut(){
  if(!musGain){ musGain=AC.createGain(); musGain.gain.value=MUS_VOL; musGain.connect(AC.destination); }
  return musGain;
}
function musicDuck(){
  try{
    if(!musGain||!AC) return;
    const g=musGain.gain, t=AC.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(MUS_DUCK,t);
    g.linearRampToValueAtTime(MUS_VOL,t+0.3);
  }catch(e){}
}
function musicStop(){
  musWant++; musCur=-1;
  if(musSrc){ try{ musSrc.stop(); }catch(e){} musSrc=null; }
}
let musicAllowed=false; // la musica suona solo dentro i livelli, mai nei menu
async function musicPlay(i){
  if(!musicAllowed || i<0 || i>=MUS_TRACKS){ musicStop(); return; }
  if(i===musCur && musSrc) return; // già in riproduzione: non ricomincia
  musicStop(); musCur=i;
  const want=++musWant;
  try{
    unlockAudio();
    if(!AC) return;
    let buf=musCache[i];
    if(!buf){
      const r=await fetch('musica/livello_'+(i+1)+'.mp3');
      buf=await AC.decodeAudioData(await r.arrayBuffer());
      musCache[i]=buf;
    }
    if(want!==musWant) return; // nel frattempo è cambiato livello o si è fermata la musica
    const src=AC.createBufferSource();
    src.buffer=buf; src.loop=true; // loop: quando la canzone finisce riparte da sola
    src.connect(musicOut()); src.start(); musSrc=src;
  }catch(e){}
}

    if(big){ if(!reserve.includes('choc')) reserve.push('choc'); }

    // oggetti da raccogliere: solo vite
    collTot++;

    if(shootOn){ reserve=reserve.filter(x=>x!=='choc'); reserve.push(t); }

// ---- Locorotondo: fiocchi di neve che congelano i mostri ----
// un mostro congelato non fa male e blocca il passaggio; si raccoglie con Y e si lancia con Y
function freezeEnemy(e){
  e.ice=true; e.fz=600; e.fly=undefined; e.w=e.w||12; e.h=e.h||12; e.dir=e.dir||1; e.vy=0;
  e.held=false; e.thrown=false; sfx('freeze');
}
function throwIce(e){
  e.held=false; e.thrown=true; e.vx=3.2*pl.face; e.vy=0;
  e.x=pl.face>0?pl.x+pl.w:pl.x-e.w; e.y=pl.y+pl.h-e.h; sfx('throw');
}
// Y: se si tiene un mostro congelato lo lancia; se se ne è vicini lo raccoglie; altrimenti spara
function snowAction(){
  const held=enemies.find(x=>x.held);
  if(held){ throwIce(held); return true; }
  const near=enemies.find(x=>x.ice&&!x.thrown&&Math.abs((x.x+x.w/2)-(pl.x+pl.w/2))<=18&&x.y<pl.y+pl.h+4&&x.y+x.h>pl.y-6);
  if(near){ near.held=true; near.fz=undefined; sfx('pick'); return true; }
  return false;
}
// il mostro congelato: sta sul terreno (cade se non c'è più), si scongela dopo 10 secondi se non viene preso
function iceStep(e){
  if(e.held){ e.x=pl.x+pl.w/2-e.w/2; e.y=pl.y-e.h-2; e.vy=0; return; }
  if(e.thrown){
    e.x+=e.vx;
    if(resolveX(e,e.vx)){ e.dead=true; sfx('impact'); return; } // contro un muro si rompe
    e.vy=Math.min((e.vy||0)+G,MAXFALL); e.onG=false; e.y+=e.vy; resolveY(e);
    if(e.y>H){ e.dead=true; return; } // è caduto in un burrone
    for(const o of enemies){
      if(o===e||o.dead||!overlap(e,o)) continue;
      // il mostro colpito diventa un oggetto da raccogliere, quello lanciato sparisce
      o.dead=true; e.dead=true; sfx('impact');
      const ct=(L.hud&&L.hud[0])||'pop';
      items.push({t:ct,x:o.x,y:o.y,got:false,c:items.length%5,find:false});
      tot[ct]=(tot[ct]||0)+1;
      return;
    }
    return;
  }
  if(e.fz!==undefined){ e.fz--; if(e.fz<=0){ e.ice=false; e.fz=undefined; } } // scongelamento
  e.vy=Math.min((e.vy||0)+G,MAXFALL); e.onG=false; e.y+=e.vy; resolveY(e);
}
// il mostro congelato blocca la gattina: non le fa male, ma non si passa; si può salire sopra saltando
function iceBlock(){
  for(const e of enemies){
    if(!e.ice||e.held||e.thrown||e.dead||!overlap(pl,e)) continue;
    if(pl.vy>=0 && pl.pb<=e.y+6){ pl.y=e.y-pl.h; pl.vy=0; pl.onG=true; pl.coyote=6; pl.flipT=0; pl.flipUsed=false; }
    else if(pl.vx>0){ pl.x=e.x-pl.w; pl.vx=0; pl.slide=0; }
    else if(pl.vx<0){ pl.x=e.x+e.w; pl.vx=0; pl.slide=0; }
  }
}

function tick(){
  if(state==='pause') return;
  if(state==='banner'){ bannerT--; if(bannerT<=0){ state='play'; updateHUD(); } return; } // riaccende la riserva
  if(state==='end'){ kissT++; return; }
  if(state!=='play') return;

  pl.pb=pl.y+pl.h; // posizione dei piedi all'inizio del frame (per lo "schiacciamento")
  if(hitCool>0) hitCool--;
  if(pl.turnT>0) pl.turnT--;
  // l'oggetto della riserva cade dall'alto; quando tocca la testa la gattina torna grande
  if(dropFx){
    dropFx.vy+=0.35; dropFx.y+=dropFx.vy;
    if(dropFx.y>=pl.y-12){ sfx('power'); if(dropFx.t!=='choc' && !shootOn) setFind(dropFx.t); big=true; dropFx=null; updateHUD(); }
  }
  // le caselle del cioccolato spariscono finché si ha il potere di sparare, e tornano quando lo si perde
  for(const b of boxes){
    if(b.t!=='choc'||b.used) continue;
    const k=b.x+','+b.y;
    if(shootOn){ if(tiles.has(k)) tiles.delete(k); }
    else if(!tiles.has(k)) tiles.set(k,'b');
  }
  if(jumpBuf>0) jumpBuf--;
  const down=!!(keys.ArrowDown||keys.KeyS||hold.d);
  const left=keys.ArrowLeft||keys.KeyA||hold.l;
  const right=keys.ArrowRight||keys.KeyD||hold.r;
  const dir=(right?1:0)-(left?1:0);
  // al cambio di direzione la vista frontale compare per qualche istante (vedi drawPlayer)
  if(dir){ if(dir!==pl.face) pl.turnT=12; pl.face=dir; }
  const run=!!(hold.y||keys.KeyZ); // Y (o Z) tenuto: corsa veloce
  const target=pl.crouch?0:dir*SPEED*(run?1.6:1)*(pl.onG?1:1.4); // accovacciata non cammina
  // Locorotondo: il ghiaccio fa scivolare un po' (la velocità arriva e si ferma piano)
  // scivola solo sul ghiaccio (il terreno 'g' di Locorotondo), non su mensole e caselle
  if(L.ice){
    if(pl.onG) pl.onIce=(tiles.get(Math.floor((pl.x+pl.w/2)/T)+','+Math.floor((pl.y+pl.h+1)/T))==='g');
    const k=pl.onIce?(pl.onG?0.08:0.03):1; // in aria, dopo il ghiaccio, la spinta si spegne piano
    pl.slide=(pl.slide||0)+(target-(pl.slide||0))*k; pl.vx=pl.slide;
  } else { pl.vx=target; pl.slide=target; }
  if(pl.bounceT>0){ pl.vx=pl.bounceV; pl.bounceT--; } // dopo il rimbalzo la spinta resta per un momento // la pioggia non rallenta più la gattina // in aria si salta più in lungo
  if(pl.onG && pl.vx){ pl.walk=(pl.walk||0)+0.4; pl.wheel=(pl.wheel||0)+Math.abs(pl.vx); pl.stepT=(pl.stepT||0)+1; const every=run?9:18; if(pl.stepT%every===0) sfx(run?'run':'step'); } // fase della camminata e passi
  if(wet>0) wet--;
  if(jumpBuf>0 && (pl.onG||pl.coyote>0)){
    // SU + GIÙ = salto mortale: salta più in alto e fa una capriola
    const mortale=down;
    pl.jbox=feetBox(); // casella da cui si salta (se c'è)
    pl.vy=mortale?JUMP*1.15:JUMP; pl.onG=false; pl.coyote=0; jumpBuf=0;
    sfx('jump'); // il tasto giù non produce suoni
    if(mortale){ pl.flipT=1; pl.flipUsed=true; }
  }
  // in aria, appena sbattuta contro un muro, A fa rimbalzare dal lato opposto
  if(jumpBuf>0 && !pl.onG && pl.wallT>0){
    pl.bounceV=-pl.wallSide*2.4; pl.bounceT=12; pl.vx=pl.bounceV; pl.vy=JUMP; pl.wallT=0;
    pl.face=-pl.wallSide; jumpBuf=0; sfx('jump');
  }
  // GIÙ mentre si è in aria = salto mortale (una volta sola per salto)
  if(!pl.onG && !pl.flipUsed && pl.flipT===0 && down){ pl.flipT=1; pl.flipUsed=true; pl.pending=pl.jbox; pl.jbox=null; }
  if(pl.flipT>0){ pl.flipT++; if(pl.flipT>32) pl.flipT=0; }

  // GIÙ da fermi a terra: la gattina si accovaccia (più bassa, schiva i pipistrelli e gli uccelli)
  // (usa anche il 'coyote': il contatto col terreno a volte manca per un frame e non deve far alternare la posa)
  const cw=(pl.onG||pl.coyote>0) && down && jumpBuf===0;
  const headFree=()=>{ const tx0=Math.floor(pl.x/T), tx1=Math.floor((pl.x+pl.w-1)/T); for(let ty=Math.floor((pl.y-7)/T);ty<=Math.floor((pl.y-1)/T);ty++) for(let tx=tx0;tx<=tx1;tx++) if(tiles.has(tx+','+ty)) return false; return true; };
  if(cw && !pl.crouch){ pl.crouch=true; pl.y+=8; pl.h=8; } // si abbassa della metà
  else if(!cw && pl.crouch && headFree()){ pl.crouch=false; pl.y-=8; pl.h=16; }
  pl.vy=Math.min(pl.vy+G,MAXFALL);
  pl.onG=false;
  if(pl.wallT>0) pl.wallT--;
  pl.x+=pl.vx; if(pl.vx && resolveX(pl,pl.vx)){ pl.wallT=8; pl.wallSide=pl.vx>0?1:-1; } // ricorda il muro appena sbattuto
  pl.x=Math.max(0,Math.min(L.w*T-pl.w,pl.x));
  const hitV=pl.vy; // velocità di caduta prima del contatto col terreno
  pl.y+=pl.vy; resolveY(pl);
  // la casella si apre solo quando ci atterri sopra
  if(pl.onG){
    let onBox=false;
    if(pl.pending && feetBox()===pl.pending){ dropBox(pl.pending); onBox=true; } // stesso suono del colpo di testa
    // tonfo solo se la capriola finisce a terra senza aver colpito una casella
    if(hitV>1.5 && pl.flipUsed && !onBox) sfx('thud');
    pl.pending=null; pl.coyote=6; pl.flipT=0; pl.flipUsed=false;
  } else if(pl.coyote>0) pl.coyote--;
  iceBlock();
  if(pl.y>H){ die(); return; }

  cam=Math.max(0,Math.min(L.w*T-W,pl.x+pl.w/2-W/2));

  // oggetti usciti da una casella: cadono fino al terreno
  for(const it of items){
    if(it.tgt!==undefined){ it.vy=Math.min(it.vy+G,MAXFALL); it.y+=it.vy; if(it.y>=it.tgt){ it.y=it.tgt; it.tgt=undefined; } }
  }
  for(const it of items){
    if(it.got||!overlap(pl,{x:it.x,y:it.y,w:10,h:10})) continue;
    it.got=true; pickItem(it.t,it.find);
  }
  items=items.filter(i=>!i.got);

  for(const e of enemies){
    if(e.dead) continue;
    if(e.ice){ iceStep(e); continue; }
    if(e.fly){
      // pipistrelli e gabbiani: niente terreno, volano su e giù e tornano dall'altro lato
      e.t+=0.09; e.ft++; e.x-=e.spd; e.y=e.base+Math.sin(e.t)*e.amp;
      if(e.x<-24) e.x=L.w*T+24;
    } else {
      e.x+=e.dir*0.5;
      if(resolveX(e,e.dir)) e.dir*=-1;
      e.vy=Math.min(e.vy+G,MAXFALL); e.onG=false;
      e.y+=e.vy; resolveY(e);
      if(e.onG){
        const ax=Math.floor((e.dir>0?e.x+e.w+1:e.x-1)/T), ay=Math.floor((e.y+e.h+1)/T);
        if(!tiles.has(ax+','+ay)) e.dir*=-1;
      }
    }
    // i volatili colpiscono solo la gattina grande (la faccia, anche con la sua altezza da grande); da piccola non la raggiungono mai
    if(e.fly ? (big && overlap({x:pl.x,y:pl.y-(pl.crouch?8:16),w:pl.w,h:pl.h+(pl.crouch?8:16)},e)) : overlap(pl,e)){
      if(pl.vy>0 && pl.pb<=e.y+6){ e.dead=true; pl.vy=-5.2; pl.onG=false; sfx('stomp'); }
      else if(e.fly){ if(big && !pl.crouch) hurt(); } // i volatili raggiungono la faccia solo se sei grande e in piedi
      else hurt();
    }
  }
  // sparo: il cuoricino vola dritto e uccide il primo mostro che colpisce
  if(shotCool>0) shotCool--;
  if(fireReq && state==='play' && L.snow && snowAction()){ /* presa o lancio del mostro congelato: niente sparo */ }
  else if(fireReq && shootOn && shotCool===0 && state==='play'){
    shots.push({x:pl.face>0?pl.x+pl.w:pl.x-8,y:pl.y+4,vx:3*pl.face,vy:0,grounded:false,life:200,snow:!!L.snow});
    shotCool=18; sfx('fire');
  }
  fireReq=false;
  for(const s of shots){
    s.life--;
    // orizzontale: contro un muro il cuoricino si ferma
    const nx=s.x+s.vx, wx=Math.floor((nx+(s.vx>0?8:-1))/T);
    if(tiles.has(wx+','+Math.floor((s.y+1)/T)) || tiles.has(wx+','+Math.floor((s.y+6)/T))) s.life=0;
    s.x=nx;
    // verticale: cade su una mensola o sul pavimento e poi continua a strisciare
    const cxT=Math.floor((s.x+4)/T);
    if(s.grounded && !tiles.has(cxT+','+Math.floor((s.y+7.5)/T))) s.grounded=false;
    if(!s.grounded){
      s.vy=Math.min(s.vy+0.3,4);
      const ny=s.y+s.vy, row=Math.floor((ny+7)/T);
      if(s.vy>0 && s.y+7<=row*T && tiles.has(cxT+','+row)){ s.y=row*T-7; s.vy=0; s.grounded=true; }
      else s.y=ny;
    }
    if(s.y>H) s.life=0;
    for(const e of enemies){
      if(!e.dead && s.x<e.x+e.w && s.x+8>e.x && s.y<e.y+e.h && s.y+7>e.y){
        if(L.snow){ s.life=0; if(!e.ice) freezeEnemy(e); break; } // il fiocco di neve congela il mostro
        // il mostro colpito diventa un oggetto da raccogliere
        e.dead=true; s.life=0; sfx('kill');
        const ct=(L.hud&&L.hud[0])||'pop';
        items.push({t:ct,x:e.x,y:e.y,got:false,c:items.length%5,find:false});
        tot[ct]=(tot[ct]||0)+1;
      }
    }
  }
  shots=shots.filter(s=>s.life>0);
  enemies=enemies.filter(e=>!e.dead);

  if(L.rain){
    if(Math.random()<0.17) rain.push({x:cam+Math.random()*W,y:-4,v:3+Math.random()*2});
    for(const d of rain){
      d.y+=d.v; d.x-=0.6;
      if(d.y>H){ d.dead=true; continue; }
      if(!umbrella && d.x>pl.x && d.x<pl.x+pl.w && d.y>pl.y && d.y<pl.y+pl.h){ d.dead=true; wet=90; }
    }
    rain=rain.filter(d=>!d.dead);
  }

  // la bandierina a metà livello diventa il punto di ripresa
  if(flag && !flag.reached && pl.x+pl.w>flag.x && pl.x<flag.x+12){ flag.reached=true; ckpt={x:flag.x,y:flag.y}; sfx('checkpoint'); }

  // entrata automatica nel luogo di fine livello
  const dx=L.door*T;
  if(pl.x+pl.w>dx+4 && pl.x<dx+5*T-4) win();
}


/* ---------- DISEGNO: SPRITE E OGGETTI ---------- */
// quando la gattina è grande il disegno è ingrandito di 1,5: ogni pixel si allarga un poco per non lasciare bordi grigi
let SP_PAD=0;
function drawSprite(rows,x,y){
  const e=SP_PAD;
  for(let j=0;j<rows.length;j++){
    const row=rows[j];
    for(let i=0;i<row.length;i++){
      const c=row[i]; if(c==='.') continue;
      g.fillStyle=PAL[c]; g.fillRect(x+i-e,y+j-e,1+2*e,1+2*e);
    }
  }
}
function drawPixelPoints(pts,x,y,col){
  g.fillStyle=col; for(const [i,j] of pts) g.fillRect(x+i,y+j,1,1);
}
function drawHeart(cx,cy,k,col){
  g.fillStyle=col;
  for(let j=0;j<HEART.length;j++) for(let i=0;i<HEART[j].length;i++)
    if(HEART[j][i]==='x') g.fillRect(cx+(i-4)*k,cy+(j-4)*k,k,k);
}
function drawUmbrella(x,y){
  g.fillStyle='#7b2cbf';
  g.beginPath(); g.arc(x+5,y+6,6,Math.PI,0); g.fill();
  g.fillStyle='#8a4b22'; g.fillRect(x+4,y+6,1,6);
}
function drawTree(x,y){
  g.fillStyle='#2f8a48';
  for(let j=0;j<8;j++){ const w=1+j; g.fillRect(x+5-Math.floor(w/2),y+j,w,1); }
  g.fillStyle='#6b3e22'; g.fillRect(x+4,y+8,2,2);
  g.fillStyle='#ffd23f'; g.fillRect(x+4,y,2,1);
}
function drawItem(it){
  const x=it.x|0, y=it.y|0, t=it.t;
  if(SPR[t]){ drawSprite(SPR[t],x,y); return; }
  if(t==='bear') drawSprite(TEDDY,x,y);
  else if(t==='umbrella') drawUmbrella(x,y);
  else if(t==='tree') drawTree(x,y);
  else if(t==='grow'){
    g.fillStyle='#d62828'; g.beginPath(); g.arc(x+5,y+5,5,0,Math.PI*2); g.fill();
    g.fillStyle='#fff'; g.fillRect(x+3,y+3,2,2); g.fillRect(x+7,y+6,1,1);
  }
  else if(t==='heart') drawHeart(x+5,y+4,1,COLL.heart.c);
  else if(t==='star') drawSprite(STAR,x,y);
  else {
    g.fillStyle=COLL[t].c; g.beginPath(); g.arc(x+5,y+5,4,0,Math.PI*2); g.fill();
    g.fillStyle='#fff'; g.fillRect(x+3,y+3,1,1);
  }
}
// il gattino maschio aspetta sotto il traguardo, appena prima dell'ingresso
// grande o piccolo come la gattina quando arriva al traguardo (prima dell'arrivo segue la gattina)
function drawBoyKitten(){
  if(!L) return;
  const arrived=(state==='won'||state==='end');
  const s=(arrived?boyBig:big)?1.5:1;
  g.save(); g.translate(L.door*T-24+7,160); g.scale(s,s); SP_PAD=s>1?0.35:0; drawSprite(KBOY,-7,-16); SP_PAD=0; g.restore();
}
// cuoricino sparato (piccolo, rosa)
function drawShot(s){
  // quando tocca terra il colpo saltella leggermente
  const hop=s.grounded?Math.round(Math.abs(Math.sin(s.life*0.45))*2.5):0;
  if(s.snow){ // fiocco di neve
    g.fillStyle='#e8f8ff';
    const x=Math.round(s.x)+3, y=Math.round(s.y)+3-hop;
    g.fillRect(x-3,y,7,1); g.fillRect(x,y-3,1,7);
    g.fillRect(x-2,y-2,1,1); g.fillRect(x+2,y-2,1,1); g.fillRect(x-2,y+2,1,1); g.fillRect(x+2,y+2,1,1);
    return;
  }
  g.fillStyle=PAL.p;
  for(let j=0;j<HEART.length;j++) for(let i=0;i<HEART[j].length;i++)
    if(HEART[j][i]==='x') g.fillRect(Math.round(s.x)+i-1,Math.round(s.y)+j-1-hop,1,1);
}
// pipistrello e gabbiano: due fotogrammi (ali alzate e abbassate)
const BAT_A=["v.........v","vv..vvv..vv","vvvvvvvvvvv","vvyvvvvvyvv",".VVvvvvvVV.","..VV.V.VV.."];
const BAT_B=["...........","vvvvvvvvvvv","VVvvvvvvvVV","vvyvvvvvyvv",".VVvvvvvVV.","..VV.V.VV.."];
const BIRD_A=["ww.....ww","wwwwwwwww","..wkwwwo.",".........","...wwww.."];
const BIRD_B=["...www...","..wkwwwo.","wwwwwwwww","...wwww..","...."];
function drawFlyer(e){
  const up=Math.floor(e.ft/5)%2;
  const rows=e.fly==='bat'?(up?BAT_A:BAT_B):(up?BIRD_A:BIRD_B);
  drawSprite(rows,Math.round(e.x+6-rows[0].length/2),Math.round(e.y+5-rows.length/2));
}
function drawEnemy(e){
  if(e.ice){ // mostro congelato: blocco di ghiaccio (lampeggia poco prima di scongelarsi)
    if(e.fz!==undefined && e.fz<150 && Math.floor(e.fz/8)%2) return;
    const x=Math.round(e.x), y=Math.round(e.y);
    g.fillStyle='rgba(140,215,255,0.85)'; g.fillRect(x,y,e.w,e.h);
    g.fillStyle='#e8f8ff'; g.fillRect(x+2,y+2,2,2); g.fillRect(x+e.w-4,y+2,2,2);
    g.fillStyle='#ffffff'; g.fillRect(x,y,e.w,1);
    return;
  }
  if(e.fly){ drawFlyer(e); return; }
  if(L.th==='space'){
    g.fillStyle='#7cfc9a'; g.beginPath(); g.ellipse(e.x+7,e.y+7,7,6,0,0,Math.PI*2); g.fill();
    g.fillStyle='#140a0c'; g.fillRect(e.x+4,e.y+5,2,2); g.fillRect(e.x+9,e.y+5,2,2);
  } else if(L.th.startsWith('xmas')){
    g.fillStyle='#ffffff'; g.beginPath(); g.arc(e.x+7,e.y+10,5,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(e.x+7,e.y+4,4,0,Math.PI*2); g.fill();
    g.fillStyle='#140a0c'; g.fillRect(e.x+5,e.y+3,1,1); g.fillRect(e.x+8,e.y+3,1,1);
    g.fillStyle='#ff9f1c'; g.fillRect(e.x+7,e.y+4,2,1);
  } else {
    g.fillStyle=L.ecol||'#b9b3c9'; g.beginPath(); g.ellipse(e.x+7,e.y+7,6,7,0,0,Math.PI*2); g.fill();
    g.fillStyle='#140a0c'; g.fillRect(e.x+4,e.y+5,3,1); g.fillRect(e.x+8,e.y+5,3,1);
  }
}

/* ---------- DISEGNO: SFONDI ---------- */
function skyline(bc,wc,off){
  for(let i=0;i<30;i++){
    const h=20+((i*37)%50);
    const x=i*18-(off%18)-18;
    g.fillStyle=bc; g.fillRect(x,H-30-h,16,h+30);
    for(let w=0;w<3;w++) for(let r=0;r*8<h;r++){
      if(((i*7+r*3+w*5)%5)===0){ g.fillStyle=wc; g.fillRect(x+3+w*4,H-26-h+r*8,2,3); }
    }
  }
}
/* ---------- SFONDI A STRISCIA: si disegnano una volta e scorrono con offset decimali ---------- */
const stripCache={};
function stripFor(key,period,paint){
  if(!stripCache[key]){
    const c=document.createElement('canvas'); c.width=period*3; c.height=H*3;
    const sg=c.getContext('2d'); sg.setTransform(3,0,0,3,0,0); sg.imageSmoothingEnabled=false;
    const mg=g; g=sg; paint(); g=mg;
    stripCache[key]=c;
  }
  return stripCache[key];
}
// disegna la striscia ripetuta a ciclo, spostata di off (anche con decimali: il canvas la interpola)
function drawStrip(c,period,off){
  const sx=((off%period)+period)%period;
  g.imageSmoothingEnabled=true;
  for(let k=-1;k<=1;k++) g.drawImage(c,k*period-sx,0,period,H);
  g.imageSmoothingEnabled=false;
}
function drawSkyStrip(bc,wc,off){
  const c=stripFor('sky|'+bc+'|'+wc,540,()=>skyline(bc,wc,0));
  drawStrip(c,540,off);
}
function drawDeco(th){
  const d=th.deco, off=cam, wrap=(v)=>((v%W)+W)%W;
  // cielo notturno o di sera: le stelle stanno dietro a tutto il resto (non nel Pumpkin contest)
  if(th.stars){ g.fillStyle='#fff'; for(const s of stars){ g.fillRect(wrap(s.x-off*0.3),s.y|0,s.s,s.s); } }
  if(th.moon){ g.fillStyle='#fff6d6'; g.beginPath(); g.arc(th.moon[0],th.moon[1],9,0,Math.PI*2); g.fill(); }
  if(d==='space'){
    g.fillStyle='#fff';
    for(const s of stars){ g.fillRect(wrap(s.x-off*0.3),s.y|0,s.s,s.s); }
  }
  else if(d==='snow'){
    g.fillStyle='rgba(255,255,255,.85)';
    for(const f of flakes){
      f.y+=f.v; f.x+=Math.sin(f.y/9)*0.3;
      if(f.y>H){ f.y=-2; f.x=Math.random()*W; }
      const s=f.v>1?2:1; g.fillRect(f.x|0,f.y|0,s,s);
    }
  }
  else if(d==='apollo'){
    g.fillStyle='#fff6d6'; g.beginPath(); g.arc(220,30,10,0,Math.PI*2); g.fill();
    drawSkyStrip('#0a1030','#ffd87a',off*0.25);
  }
  else if(d==='city'){ drawSkyStrip(th.bld,th.win||'#ffd87a',off*0.25); }
  else if(d==='cave'){
    for(let i=0;i<8;i++){ g.fillStyle=i%2?'#b8a57e':'#a8966e'; g.fillRect(0,20+i*18,W,9); }
    g.fillStyle='#7a6a4e';
    for(let i=0;i<6;i++){ g.fillRect(wrap(i*52-off*0.4),40+(i%3)*30,20,6); }
  }
  else if(d==='sea'){
    g.fillStyle='#ffe9a8'; g.beginPath(); g.arc(210,28,9,0,Math.PI*2); g.fill();
    g.fillStyle=th.sea; g.fillRect(0,120,W,72);
    g.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<12;i++){ g.fillRect(wrap(i*30-off*0.4),126+(i%3)*12,8,1); }
  }
  else if(d==='hills'){
    for(const s of stars){ g.fillStyle='#fff'; g.fillRect(wrap(s.x-off*0.3),s.y|0,s.s,s.s); }
    g.fillStyle=th.hill;
    for(let i=0;i<5;i++){ g.beginPath(); g.ellipse(wrap(i*70-off*0.3)-30,190,50,30,0,0,Math.PI*2); g.fill(); }
  }
  else if(d==='lights'){
    const cols=['#ffd23f','#ff4f8b','#4cc9f0'];
    for(let i=0;i<60;i++){ g.fillStyle=cols[i%3]; g.fillRect(wrap(i*17-off*0.5),(8+(i%2)*6+Math.sin(i)*3),2,2); }
    drawSkyStrip(th.bld,'#ffd87a',off*0.25);
  }
  else if(d==='spooky'){
    g.fillStyle='#e8e0ff'; g.beginPath(); g.arc(200,30,9,0,Math.PI*2); g.fill();
    g.fillStyle='#0a0612';
    for(let i=0;i<6;i++){ const x=wrap(i*50-off*0.3); g.fillRect(x,130,2,40); g.fillRect(x-4,136,10,2); }
  }
  else if(d==='plants'){
    g.fillStyle='#3f8a3f';
    for(let i=0;i<7;i++){ g.beginPath(); g.arc(wrap(i*44-off*0.35),176,18,0,Math.PI*2); g.fill(); }
  }
  else if(d==='spa'){
    // come il Parco delle Cave, ma con le piante
    for(let i=0;i<8;i++){ g.fillStyle=i%2?'#b8a57e':'#a8966e'; g.fillRect(0,20+i*18,W,9); }
    g.fillStyle='#7a6a4e';
    for(let i=0;i<6;i++){ g.fillRect(wrap(i*52-off*0.4),40+(i%3)*30,20,6); }
    // piante in alto (foglie che scendono) e cespugli in basso
    for(let i=0;i<8;i++){
      const x=wrap(i*36-off*0.25);
      g.fillStyle='#2f7a3a'; g.fillRect(x,0,1,12+(i%3)*4);

/* ---------- DISEGNO: GATTINA ---------- */
// gattina di profilo: gamba e braccio si muovono durante la camminata
// vestito del livello attivo: solo quando la gattina ha preso l'oggetto che dà i poteri
function outfitNow(){ return (heldType && OUTFIT[lvlIdx]) ? Object.assign({hat:!!OUTFIT[lvlIdx].hat}, outfitSet(OUTFIT[lvlIdx])) : null; }
function santaOn(){ const od=outfitNow(); return !!(od&&od.hat); }
function frontNow(){
  if(powered) return KB;
  if(helmet) return CAMO_F;
  const od=outfitNow();
  if(od) return od.front;
  return redDress?KR:KITTY;
}
function drawProfile(x0,y0){
  const od=outfitNow();
  const v=powered?VAR.bear:(helmet?VAR.camo:(od?{body:od.side,arm:od.arm,leg:od.leg}:(redDress?VAR.dress:VAR.kitty)));
  const ph=L.vehicle==='quad'?0:(pl.walk||0); // sul quad braccia e gambe restano ferme
  const lx=Math.round(Math.sin(ph)*1.5), ly=Math.sin(ph)>0.5?-1:0;
  const ax=Math.round(Math.sin(ph+Math.PI)*1);
  drawSprite(v.body,x0,y0);
  // braccio e gamba stanno entrambi al centro del corpo (visti di profilo)
  drawSprite(v.leg,x0+6+lx,y0+12+ly);
  drawSprite(v.arm,x0+6+ax,y0+9);
}
// mani sul manubrio del quad (coordinate della gattina seduta)
function drawRideHands(front){
  const hand=(x,y)=>{ g.fillStyle=PAL.w; g.fillRect(x,y,2,2); };
  const arm=(x1,y1,x2,y2)=>{
    g.fillStyle=helmet?PAL.g:PAL.p; const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1),1);
    for(let i=0;i<=n;i++) g.fillRect(Math.round(x1+(x2-x1)*i/n),Math.round(y1+(y2-y1)*i/n),1,1);
  };
  if(front){ arm(-4,-9,-11,-5); arm(4,-9,10,-5); hand(-12,-5); hand(10,-5); }
  else {
    // mentre guida il braccio si muove con la camminata
    const ph=pl.walk||0, w=Math.round(Math.sin(ph)*1.5), dy=Math.sin(ph)>0?-1:0;
    arm(0,-8,6+w,-8+dy); hand(6+w,-9+dy);
  }
}
function drawPlayer(){
  if(hitCool>0 && Math.floor(hitCool/4)%2) return;
  SP_PAD=big?0.35:0; // scala 1,5: ogni pixel si allarga un poco per non lasciare bordi grigi
  try{ drawPlayerInner(); } finally { SP_PAD=0; }
}
function drawPlayerInner(){
  // da ferma la gattina è di fronte; quando si muove (o è in aria) è di profilo
  // (a terra vale anche il "coyote time": evita lo scambio di vista frame per frame da fermi)
  const still=(pl.onG||pl.coyote>0) && pl.vx===0;
  // sul quad la gattina resta sempre di profilo, tranne un attimo al cambio di direzione
  const onQuad=L.vehicle==='quad';
  // accovacciata: si vede solo la vista di fronte schiacciata (un solo disegno, niente frame sovrapposti)
  const showFront=onQuad ? (pl.turnT>0) : (still||!!pl.crouch);
  const front=showFront ? frontNow() : null;
  const s=big?1.5:1; // stessa taglia del gattino maschio che aspetta alla fine
  if(pl.flipT>0){
    const cx=Math.round(pl.x+pl.w/2), cy=Math.round(pl.y+pl.h/2);
    g.save(); g.translate(cx,cy); g.rotate(pl.face*(pl.flipT/32)*Math.PI*2); g.scale(s,s);
    if(front) drawSprite(front,-7,-8); else drawProfile(-7,-8);
    if(helmet) drawSprite(HELM_FULL,-7,-8);
    if(santaOn()) drawSprite(SANTA_HAT,-7,-14);
    drawPixelPoints(BOW,front?-7:-9,-8,PAL.r);
    g.restore();
    return;
  }
  const ox=Math.round(pl.x+pl.w/2), oy=Math.round(pl.y+pl.h);
  g.save();
  g.translate(ox,oy); g.scale(pl.face<0?-s:s,s);
  const quad=L.vehicle==='quad';
  if(quad){ drawSprite(front?QUAD_FRONT:QUAD_SPIN[Math.floor((pl.wheel||0)/6)%2],-14,-14); g.translate(0,-6); } // il quad sta sotto, la gattina è seduta sulla sella
  if(pl.crouch){ // accovacciata: la vista di fronte con una riga su due, pixel interi (niente sfumature)
    const fr=front||frontNow(); drawSprite(fr.filter((_,i,a)=>(a.length-1-i)%2===0),-7,-8);
  }
  else if(front){ drawSprite(front,-7,-16); if(helmet) drawSprite(HELM_FULL,-7,-16); if(santaOn()) drawSprite(SANTA_HAT,-7,-20); else drawPixelPoints(BOW,-7,-16,PAL.r); }
  else { drawProfile(-7,-16); if(helmet) drawSprite(HELM_FULL,-7,-16); if(santaOn()) drawSprite(SANTA_HAT,-7,-20); else drawPixelPoints(BOW,-9,-16,PAL.r); }
  if(quad) drawRideHands(!!front);
  g.restore();
}

  const mainG=g; g=bgG; bgG.setTransform(3,0,0,3,0,0); bgG.imageSmoothingEnabled=false;

    drawHeart(dx+bw+6,base-14,1,'#ff9fc4');
    drawHeart(dx+bw-18,base-16,1,'#ff9fc4');
  }
  g.restore();

  if(state==='banner'){
    // frasi lunghe: spezzate in due righe, con la fascia del banner più alta
    g.font='7px "Press Start 2P",monospace';
    let lines=[L.place];
    if(L.place.length>30){

      for(let k=1;k<words.length;k++){

        if(!best||m<best.m) best={a,b,m};
      }

    g.fillStyle='#ffffff'; g.font='8px "Press Start 2P",monospace';
    g.fillText(L.name.toUpperCase(),W/2,104);
    g.font='7px "Press Start 2P",monospace'; g.fillStyle='#c9bfe8';
    lines.forEach((t,k)=>g.fillText(t,W/2,116+k*9));

/* ---------- CICLO E COMANDI ---------- */
let acc=0,last=performance.now();
function loop(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ tick(); acc-=1000/60; }
  draw();
  requestAnimationFrame(loop);
}
// navigazione dei menu con la croce (frecce) e A per scegliere
function menuBtns(){ const ov=document.getElementById('ov'); if(ov.hidden) return []; return [...ov.querySelectorAll('button, input[type=range]')].filter(b=>b.offsetParent!==null&&!b.disabled); }
// le frecce dei menu suonano solo quando il pulsante selezionato cambia
function menuMove(dx,dy){
  const before=document.activeElement;
  menuMoveInner(dx,dy);
  if(document.activeElement!==before) sfx('menu');
}
function menuMoveInner(dx,dy){
  const ae=document.activeElement;
  const bs=menuBtns(); if(!bs.length) return;
  // se il focus si è perso (tocco fuori dai pulsanti), la croce riporta il cursore sull'ultima scelta
  if(!ae||ae===document.body||!ae.closest('#ov, #menuBtn')){ const f=(lastMenuFocus&&bs.includes(lastMenuFocus))?lastMenuFocus:bs[0]; f.focus({preventScroll:true}); return; }
  // il pulsante MENU selezionato con X: la croce riporta sui pulsanti del menu
  if(document.activeElement===document.getElementById('menuBtn')){ bs[0].focus({preventScroll:true}); return; }
  // schermata di ascolto: destra/sinistra seguono l'ordine dei tasti (◀◀ ▶ ■ ▶▶ LOOP, poi -10, barra, +10, INDIETRO)
  const pp=document.getElementById('plPlayer');
  if(dx && !pp.hidden && pp.contains(document.activeElement)){
    const items=[...pp.querySelectorAll('button, input[type=range]')];
    const i=items.indexOf(document.activeElement);
    if(i>=0) items[Math.max(0,Math.min(items.length-1,i+dx))].focus();
    return;
  }
  // elenco delle canzoni: su/giù scorre in cerchio (dalla prima si sale all'ultima)
  const pl=[...document.getElementById('plList').children];
  const pi=pl.indexOf(document.activeElement);
  if(pi>=0 && dy){ const n=pl.length; if(dy>0 && pi===n-1){ document.getElementById('plBack').focus(); return; } pl[(pi+dy+n)%n].focus(); return; } // giù dall'ultima va su INDIETRO, su dalla prima va all'ultima
  const cur=bs.indexOf(document.activeElement);
  if(cur<0){ bs[0].focus(); return; }
  const c=bs[cur].getBoundingClientRect(), cx=c.left+c.width/2, cy=c.top+c.height/2;
  let best=-1, bd=Infinity;
  bs.forEach((b,i)=>{
    if(i===cur) return;
    const r=b.getBoundingClientRect(), ddx=r.left+r.width/2-cx, ddy=r.top+r.height/2-cy;
    if(dx && Math.sign(ddx)!==dx) return;
    if(dy && Math.sign(ddy)!==dy) return;
    const d=dx ? Math.abs(ddx)+2*Math.abs(ddy) : Math.abs(ddy)+2*Math.abs(ddx);
    if(d<bd){ bd=d; best=i; }
  });
  if(best>=0) bs[best].focus();
}
function menuPress(){ if(document.activeElement===document.getElementById('menuBtn')){ goMenu(); return; } const bs=menuBtns(); if(!bs.length) return; const f=bs.includes(document.activeElement)?document.activeElement:bs[0]; f.click(); }
const JUMP_KEYS=['Space','ArrowUp','KeyW'];
addEventListener('keydown',e=>{
  const game=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'];
  if(game.includes(e.code)) e.preventDefault();
  keys[e.code]=true;
  if(JUMP_KEYS.includes(e.code)) jumpBuf=7;
  if(!document.getElementById('ov').hidden){
    const md={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.code];
    if(md) menuMove(md[0],md[1]);
    if(e.code==='Enter') menuPress();
  }
  if(e.code==='KeyR') useReserve();
  if(e.code==='KeyP'||e.code==='Escape') togglePause();
  if(e.code==='KeyX' && !e.repeat) fireReq=true;
  unlockAudio();
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
const menuRep={};
let yArrow=false; // Y premuto con una freccia = corsa, non sparo
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  if(k==='p'){ b.addEventListener('pointerdown',e=>{ e.preventDefault(); togglePause(); }); return; }
  const on=e=>{ e.preventDefault();
    try{ b.setPointerCapture(e.pointerId); }catch(_){} // il tasto riceve sempre il rilascio, anche se il dito scivola
    if(!document.getElementById('ov').hidden){ // nei menu la croce sposta il cursore e A sceglie
      const md={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]}[k];
      if(md){ menuMove(md[0],md[1]); clearTimeout(menuRep[k]); clearInterval(menuRep[k]); menuRep[k]=setTimeout(()=>{ menuRep[k]=setInterval(()=>menuMove(md[0],md[1]),130); },420); } // tenuta premuta: scorre
      else if(k==='a') menuPress();
      else if(k==='x') document.getElementById('menuBtn').focus({preventScroll:true}); // X seleziona il pulsante MENU
      unlockAudio(); return;
    }
    hold[k]=true;
    // X seleziona il pulsante MENU (riquadro giallo); A lo preme e torna al menu
    if(k==='a' && document.activeElement===document.getElementById('menuBtn')){ goMenu(); unlockAudio(); return; }
    if(k==='a'||k==='u') jumpBuf=7; if(k==='x') document.getElementById('menuBtn').focus({preventScroll:true}); if(k==='b') useReserve(); if(k==='y') yArrow=false; if((k==='l'||k==='r') && hold.y) yArrow=true; unlockAudio(); };
  // Y: un tocco senza frecce spara (al rilascio); con una freccia corre
  const off=e=>{ hold[k]=false; clearTimeout(menuRep[k]); clearInterval(menuRep[k]); if(k==='y'){ if(e&&e.type==='pointerup'&&!yArrow) fireReq=true; yArrow=false; } };
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerup',off);
  b.addEventListener('pointerleave',off);
  b.addEventListener('pointercancel',off);
  b.addEventListener('lostpointercapture',off);
});
// toccare un punto che non è un pulsante non deve far perdere la selezione del menu
document.addEventListener('mousedown',e=>{ if(!document.getElementById('ov').hidden && !e.target.closest('button, input, a')) e.preventDefault(); },true);
document.addEventListener('focusin',e=>{ if(e.target.closest && e.target.closest('#ov') && e.target.matches('button, input')) lastMenuFocus=e.target; });
document.addEventListener('focusout',e=>{
  if(intentionalBlur || e.relatedTarget || document.getElementById('ov').hidden || !lastMenuFocus) return;
  const lf=lastMenuFocus;
  setTimeout(()=>{ if(!document.getElementById('ov').hidden && (!document.activeElement || document.activeElement===document.body)) lf.focus({preventScroll:true}); },0);
});
// sicurezza: se il gioco perde il tocco (scorrimento, cambio app) si azzerano comandi e ripetizioni
function resetPad(){ for(const k in hold) hold[k]=false; for(const k in menuRep){ clearTimeout(menuRep[k]); clearInterval(menuRep[k]); } }
addEventListener('blur',resetPad);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) resetPad(); });
document.addEventListener('pointercancel',resetPad);
document.getElementById('menuBtn').addEventListener('click',goMenu);
document.getElementById('plBtn').addEventListener('click',()=>{ sfx('click'); showPlaylist(); });
document.getElementById('plBack').addEventListener('click',()=>{ sfx('click'); hidePlaylist(); });
document.getElementById('plPBack').addEventListener('click',()=>{ sfx('click'); backToList(); });
document.getElementById('plPlay').addEventListener('click',()=>{ sfx('click'); plPlayPause(); });
document.getElementById('plLoop').addEventListener('click',()=>{ sfx('click'); plLoopOn=!plLoopOn; if(plSrc) plSrc.loop=plLoopOn; updatePlUI(); });
document.getElementById('plSeek').addEventListener('input',e=>plSeekTo(+e.target.value));
// dopo aver toccato la barra del tempo il cursore torna sui tasti, così le frecce funzionano di nuovo
document.getElementById('plSeek').addEventListener('pointerup',()=>{ const s=document.getElementById('plSeek'); s.blur(); document.getElementById('plPlay').focus({preventScroll:true}); });
document.querySelectorAll('#plPlayer [data-pa]').forEach(b=>b.addEventListener('click',()=>{
  sfx('click'); const a=b.dataset.pa;
  if(a==='prev') plGo(-1); else if(a==='next') plGo(1); else if(a==='stop') plStop();
  else if(a==='back10') plSeekTo(plPos()-10); else if(a==='fwd10') plSeekTo(plPos()+10);
}));
// elenco delle canzoni: un pulsante per livello
// caricamento anticipato: quando si mette il cursore su una canzone, la si prepara
document.getElementById('plList').addEventListener('focusin',e=>{ const i=[...document.getElementById('plList').children].indexOf(e.target); if(i>=0) plFetch(i).catch(()=>{}); });
SONGS.forEach((t,i)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=(i+1)+'. '+t; b.addEventListener('click',()=>{ sfx('click'); openSong(i); }); document.getElementById('plList').appendChild(b); });
document.getElementById('resBtn').addEventListener('click',useReserve);

/* ---------- AVVIO ---------- */
initBg();
loadLevel(0);
buildMenu();
state='title';
showOverlay('Syria Kitty Bros','Scegli un livello, oppure premi Gioca per ricominciare dal Livello 1.','Gioca',startGame);
requestAnimationFrame(loop);
</script>
