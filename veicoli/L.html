<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L come Limousine</title>
<style>@font-face{font-family:"Chewy";src:url("assets/Chewy-Regular.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap;}
:root{--ink:#1d2b4a;--card:#ffffff;--edge:#d9b98f;--green:#16b33a;--green-d:#0b7a24;--blue:#0a7cff;--red:#ff2e4d;--font-display:"Chewy",ui-rounded,"Nunito",system-ui,sans-serif;--font-body:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(#bfe3ff 0%,#eaf6ff 64%,#9ed98a 64%) no-repeat;font-family:var(--font-body);color:var(--ink);}
.app{box-sizing:border-box;height:100%;max-width:520px;margin:0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;min-height:0;}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;flex:none;}
.nav .spacer{display:block;}
.btn-nav.mid{white-space:normal;text-align:center;line-height:1.1;font-size:clamp(.7rem,3vw,.88rem);padding:0 8px;min-width:96px;}
.btn-nav.side{font-size:clamp(.78rem,3.4vw,.95rem);padding:0 6px;}
.btn-nav{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 10px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:clamp(.85rem,3.8vw,1rem);text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.18);white-space:nowrap;}
.top{display:flex;gap:10px;align-items:stretch;flex:none;height:clamp(64px,11vh,88px);}
.letter{flex:none;width:clamp(104px,30%,132px);display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:3px solid var(--edge);border-radius:22px;font-family:var(--font-display);font-weight:900;font-size:clamp(2.4rem,10vh,3.4rem);line-height:1;color:var(--red);cursor:pointer;padding:0 8px;}
.letter span:last-child{color:var(--blue);}
.word{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--card);border:3px solid var(--edge);border-radius:22px;padding:6px 8px;box-sizing:border-box;font-family:var(--font-display);font-weight:900;font-size:clamp(1.3rem,7vw,2.2rem);letter-spacing:.02em;white-space:nowrap;}
.word span{-webkit-text-stroke:1.5px rgba(29,43,74,.55);paint-order:stroke fill;}
.word span:nth-child(4n+1){color:#ff2e4d;} .word span:nth-child(4n+2){color:#0a7cff;} .word span:nth-child(4n+3){color:#ffb300;} .word span:nth-child(4n+4){color:#16b33a;}
.stagewrap{position:relative;flex:1;min-height:0;display:flex;}
.stage{position:relative;flex:1;width:100%;min-height:0;padding:0;border:3px solid var(--edge);border-radius:24px;background:var(--card);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden;transition:opacity .25s ease,visibility 0s;}
.pop{animation:pop .5s ease-out;} @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}
.v3hint{position:absolute;top:8px;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;background:var(--card);color:#3a4a6b;border:2px solid var(--edge);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;line-height:1.25;text-align:center;pointer-events:none;}
.v3load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--card);color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:1.05rem;text-align:center;padding:16px;}
.v3load[hidden]{display:none;}
.v3load progress{width:min(70%,260px);height:14px;accent-color:var(--green);}
.caption{flex:none;text-align:center;font-family:var(--font-display);font-weight:800;font-size:clamp(1.05rem,4.8vw,1.5rem);color:#7a3e00;line-height:1.15;text-wrap:balance;}
.actions{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;padding:6px 4px;border:3px solid #2ed657;border-radius:22px;background:#ffffff;cursor:pointer;font-family:var(--font-display);font-weight:900;font-size:clamp(.85rem,3.8vw,1rem);box-shadow:0 4px 0 rgba(0,0,0,.18);}
.act:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
.act svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.act-go{color:var(--red);} .act-s{color:var(--blue);} .act-l{color:var(--green);}
.card{position:fixed;left:12px;right:12px;bottom:150px;max-width:496px;margin:0 auto;z-index:15;display:none;flex-direction:column;gap:8px;background:var(--card);border:3px solid var(--edge);border-radius:22px;padding:14px 16px;box-sizing:border-box;box-shadow:0 8px 20px rgba(0,0,0,.2);max-height:55vh;overflow:auto;}
.card.open{display:flex;animation:pop .4s ease-out;}
.card h2{margin:0;font-family:var(--font-display);font-size:1.2rem;color:var(--blue);}
.card p{margin:0;font-size:1.05rem;line-height:1.45;}
.card .hard{font-size:.92rem;color:#3a4a6b;border-top:2px dashed var(--edge);padding-top:8px;}
.close{align-self:flex-end;min-height:44px;min-width:104px;border-radius:999px;border:2px solid var(--edge);background:#fff;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;}
.parents{flex:none;align-self:center;font-size:.9rem;}
.parents summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.75);font-weight:800;color:var(--ink);}
.parents summary::-webkit-details-marker{display:none;}
.parents[open]{position:fixed;left:12px;right:12px;bottom:12px;max-width:496px;margin:0 auto;z-index:20;background:var(--card);border:3px solid var(--edge);border-radius:22px;padding:12px 14px;box-sizing:border-box;}
.parents[open] summary{background:transparent;}
.parents .x{display:none;width:34px;height:34px;border-radius:50%;background:#ff2e4d;color:#fff;font-size:1.1rem;font-weight:900;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.25);line-height:1;}
.parents[open] .lbl{display:none;}
.parents[open] .x{display:flex;}
.parents[open] summary{justify-content:flex-end;padding:0;min-height:34px;}
.parents p{margin:8px 0 0;color:#3a4a6b;line-height:1.4;}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ctrl label{font-weight:700;}
.ctrl input[type=range]{flex:1;min-width:110px;accent-color:var(--green);}
.mute{background:#fff;color:var(--ink);border:2px solid var(--edge);border-radius:12px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;min-height:40px;}
.mute[aria-pressed="true"]{border-color:var(--red);}

.pop { animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12) rotate(-2deg); } 100% { transform: scale(1); } }
.dust, .spark { opacity: 0; }
.dust { fill: #e9dcc3; stroke: #a8916a; stroke-width: 4; transform-box: fill-box; transform-origin: center; }
.spark { fill: var(--sun); stroke: #e08a00; stroke-width: 3; transform-box: fill-box; transform-origin: center; }
.hop #car { animation: hop .5s ease-out; }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-28px); } 100% { transform: translateY(0); } }
.rolling #car { transform-origin: 350px 330px; animation: zoom 3.2s ease-in-out 1; }
@keyframes zoom { 0% { transform: translate(0, 0) rotate(0deg); } 15% { transform: translate(-4px, 1px) rotate(-.3deg); } 45% { transform: translate(-55px, 4px) rotate(-1deg); } 65% { transform: translate(-62px, 4px) rotate(.4deg); } 85% { transform: translate(-20px, 2px) rotate(-.2deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
.rolling .dust { animation: dust 1.1s ease-out infinite; }
.rolling .p2 { animation-delay: .35s; }
.rolling .p3 { animation-delay: .7s; }
@keyframes dust { 0% { opacity: 0; transform: translate(0, 0) scale(.4); } 20% { opacity: .95; } 100% { opacity: 0; transform: translate(110px, -70px) scale(1.7); } }
.rolling .spark { animation: twinkle 1s ease-in-out infinite; }
.rolling .s2 { animation-delay: .3s; }
.rolling .s3 { animation-delay: .6s; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
  box-shadow: 0 6px 0 rgba(0, 0, 0, .22);
  .hop #car, .rolling #car, .rolling .dust, .rolling .spark, .pop { animation: none; }
  .rolling .dust { opacity: .5; }
.stage svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);display:block;}
</style></head>

<script>
var runId = 0;
function interrupt() {
  runId++;
  current.forEach(function (a) { try { a.pause(); } catch (e) {} });
  current = [];
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  stage.classList.remove('hop', 'rolling');
  busy = false;
}


var AUDIO = {"voice": "assets/L-voice.mp3", "letter": "assets/L-letter.mp3", "word": "assets/L-word.mp3", "siren": "assets/L-sound.mp3", "soggetto": "assets/L-soggetto.mp3", "lettera": "assets/L-lettera.mp3", "sound": "assets/L-sound.mp3"};

var stage = document.getElementById('stage');
var caption = document.getElementById('caption');
var volEl = document.getElementById('vol');
var muteBtn = document.getElementById('mute');
var vol = 0.5, muted = false, busy = false, ctx = null;

volEl.addEventListener('input', function () { vol = parseFloat(volEl.value); applyVolume(); });
// Su iPhone/iPad il volume della pagina non è regolabile: si usano i tasti del dispositivo.
(function () {
  try {
    var t = new Audio(); t.volume = 0.5;
    if (t.volume !== 0.5) {
      volEl.disabled = true;
      var lab = document.querySelector('label[for="vol"]');
      if (lab) lab.textContent = 'Volume (usa i tasti del dispositivo)';
    }
  } catch (e) {}
})();
muteBtn.addEventListener('click', function () {
  muted = !muted;
  muteBtn.setAttribute('aria-pressed', String(muted));
  muteBtn.textContent = muted ? 'Riattiva audio' : 'Silenzia';
  applyVolume();
});

function level() { return muted ? 0 : vol; }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function say(t) { caption.textContent = t; }

function speak(text, fallbackMs) {
  return new Promise(function (resolve) {
    var done = false;
    function fin() { if (!done) { done = true; resolve(); } }
    if (level() === 0 || !('speechSynthesis' in window)) { setTimeout(fin, fallbackMs || 1400); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'it-IT'; u.rate = 0.8; u.pitch = 1.15; u.volume = level();
      var voices = window.speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf('it') === 0) { u.voice = voices[i]; break; }
      }
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 4500);
      window.speechSynthesis.speak(u);
    } catch (e) { setTimeout(fin, fallbackMs || 1400); }
  });
}

var current = [];
function applyVolume() {
  current.forEach(function (a) { a.volume = vol; a.muted = muted; });
}
function playFile(src) {
  return new Promise(function (resolve) {
    var a = new Audio(src);
    a.volume = vol; a.muted = muted;
    current.push(a);
    function fin() { var i = current.indexOf(a); if (i > -1) current.splice(i, 1); resolve(); }
    a.onended = fin; a.onerror = fin;
    var p = a.play();
    if (p && p.catch) p.catch(fin);
  });
}

function engineSound() {
  var total = 3.2;
  return new Promise(function (resolve) {
    if (level() === 0) { setTimeout(resolve, total * 1000); return; }
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      var t = ctx.currentTime;
      var master = ctx.createGain();
      master.gain.setValueAtTime(0, t);
      master.gain.linearRampToValueAtTime(level() * 0.32, t + 0.15);
      master.gain.setValueAtTime(level() * 0.32, t + total - 0.5);
      master.gain.linearRampToValueAtTime(0, t + total);
      master.connect(ctx.destination);
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500; lp.connect(master);
      var o = ctx.createOscillator(); o.type = 'sawtooth';
      // due colpi d'acceleratore: brum... brum!
      o.frequency.setValueAtTime(60, t);
      o.frequency.exponentialRampToValueAtTime(110, t + 1.4);
      o.frequency.exponentialRampToValueAtTime(130, t + 2.0);
      o.frequency.exponentialRampToValueAtTime(65, t + total);
      var am = ctx.createGain(); am.gain.value = 0.6;
      var lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 12;
      var lg = ctx.createGain(); lg.gain.value = 0.12;
      lfo.connect(lg); lg.connect(am.gain); o.connect(am); am.connect(lp);
      o.start(t); lfo.start(t); o.stop(t + total + 0.05); lfo.stop(t + total + 0.05);
      // sassi e sobbalzi
      [].forEach(function (d) {
        var th = ctx.createOscillator(); th.frequency.setValueAtTime(95, t + d); th.frequency.exponentialRampToValueAtTime(40, t + d + 0.18);
        var tg = ctx.createGain(); tg.gain.setValueAtTime(0.5, t + d); tg.gain.exponentialRampToValueAtTime(0.001, t + d + 0.2);
        th.connect(tg); tg.connect(master); th.start(t + d); th.stop(t + d + 0.25);
      });
      setTimeout(resolve, total * 1000 + 100);
    } catch (e) { setTimeout(resolve, total * 1000); }
  });
}

async function playSound() {
  interrupt();
  var my = runId;
  stage.classList.add('rolling');
  say("Vrrr... che eleganza!");
  await (AUDIO.sound ? playFile(AUDIO.sound) : sleep(3000));
  if (my === runId) {
    stage.classList.remove('rolling');
    say("Tocca di nuovo!");
  }
}

async function playVoice() {
  interrupt();
  var my = runId;
  stage.classList.add('hop');
  say("L come Limousine");
  await (AUDIO.voice ? playFile(AUDIO.voice) : speak("L come Limousine", 1600));
  if (my === runId) stage.classList.remove('hop');
}


async function playPart(el, text, file) {
  interrupt();
  busy = true;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  say(text);
  await (file ? playFile(file) : speak(text, 1000));
  busy = false;
}

stage.addEventListener('click', playSound);
document.getElementById('go').addEventListener('click', playVoice);

var letterEl = document.getElementById('letter'), wordEl = document.getElementById('word');
function onKey(fn) { return function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }; }
var tapLetter = function () { playPart(letterEl, 'L', AUDIO.letter); };
var tapWord = function () { playPart(wordEl, 'Limousine', AUDIO.word); };
letterEl.addEventListener('click', tapLetter); letterEl.addEventListener('keydown', onKey(tapLetter));
wordEl.addEventListener('click', tapWord); wordEl.addEventListener('keydown', onKey(tapWord));

if ('speechSynthesis' in window) { try { window.speechSynthesis.getVoices(); } catch (e) {} }

</script>
<script>

var SCHEDE = {
  soggetto: { titolo: "Limousine", testo: "La limousine è un’auto lunga lunga ed elegante, con tanti posti a sedere e i vetri oscurati. Si usa per i matrimoni, per le feste o per portare persone importanti.", hard: "«Elegante» vuol dire bella, curata e ben fatta." },
  lettera: { titolo: "La lettera L", testo: "La L è una consonante. Si legge sempre l, come in limousine.", hard: "" }
};
var cardEl=document.getElementById('card'), cardTitle=document.getElementById('card-title'), cardText=document.getElementById('card-text'), cardHard=document.getElementById('card-hard');
var btnS=document.getElementById('btn-soggetto'), btnL=document.getElementById('btn-lettera'), cardTimer=null, openId=0;
function cardStop(){ current.forEach(function(a){try{a.pause();}catch(e){}}); current=[]; if('speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(e){}} }
function cardNarrate(file,text,ms){ return file?playFile(file):speak(text,ms); }
function setOpen(kind){ btnS.setAttribute('aria-expanded',String(kind==='soggetto')); btnL.setAttribute('aria-expanded',String(kind==='lettera')); }
function openCard(kind){
  cardStop(); clearTimeout(cardTimer); var my=++openId; var s=SCHEDE[kind];
  cardTitle.textContent=s.titolo; cardText.textContent=s.testo; cardHard.textContent=s.hard||''; cardHard.style.display=s.hard?'':'none';
  cardEl.classList.add('open'); setOpen(kind);
  cardNarrate(AUDIO[kind], s.testo, 4000).then(function(){ if(my===openId) cardTimer=setTimeout(closeCard,10000); });
}
function closeCard(){ openId++; cardStop(); clearTimeout(cardTimer); cardEl.classList.remove('open'); setOpen(null); }
btnS.addEventListener('click',function(){openCard('soggetto');});
btnL.addEventListener('click',function(){openCard('lettera');});
document.getElementById('close').addEventListener('click',closeCard);
function fitWord(){var w=document.getElementById('word');w.style.fontSize='';var sz=parseFloat(getComputedStyle(w).fontSize);while(w.scrollWidth>w.clientWidth&&sz>12){sz-=1;w.style.fontSize=sz+'px';}}
fitWord(); window.addEventListener('resize',fitWord);

</script>
<script>
(function(){
  var PREV="K.html", NEXT="M.html";
  var app=document.querySelector('.app');
  var wrap=document.getElementById('stagewrap');
  var EDGE_SKIP='#v3d, model-viewer, input, .card, .parents, summary, .go3d, .act, .close, .mute';
  var s=null, mode=null, dx=0, busy=false, t0=0;
  function can(d){ return d<0 ? !!NEXT : !!PREV; }
  function setT(x,anim){ app.style.transition = anim ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none'; app.style.transform = x===0 ? 'none' : 'translateX('+x+'px)'; }
  // ingresso: la nuova scheda scorre dentro dal lato da cui è arrivato il dito
  try{
    var inDir=sessionStorage.getItem('slideIn'); sessionStorage.removeItem('slideIn');
    if(inDir){ var w0=window.innerWidth; setT(inDir==='from-right'? w0 : -w0, false); void app.offsetWidth; setT(0,true); setTimeout(function(){ app.style.transition='none'; app.style.transform='none'; }, 320); }
  }catch(e){}
  document.addEventListener('touchstart', function(e){
    if(busy || (wrap && wrap.classList.contains('is3d'))) { s=null; return; }
    if(e.target.closest && e.target.closest(EDGE_SKIP)) { s=null; return; }
    s={x:e.touches[0].clientX, y:e.touches[0].clientY}; t0=Date.now(); mode=null; dx=0;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!s || busy) return;
    var ddx=e.touches[0].clientX-s.x, ddy=e.touches[0].clientY-s.y;
    if(!mode && (Math.abs(ddx)>10 || Math.abs(ddy)>10)) mode = Math.abs(ddx) > 1.3*Math.abs(ddy) ? 'h' : 'v';
    if(mode!=='h') return;
    dx=ddx;
    var follow = can(dx) ? dx : dx*0.25;   // resistenza ai bordi (prima e ultima lettera)
    setT(follow,false);
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!s || busy){ s=null; return; }
    var moved = mode==='h';
    var dt=Math.max(1,Date.now()-t0), v=Math.abs(dx)/dt;
    var w=window.innerWidth;
    var go = moved && can(dx) && (Math.abs(dx) > w*0.22 || (v > 0.45 && Math.abs(dx) > 40));
    s=null;
    if(go){
      busy=true;
      var target = dx<0 ? NEXT : PREV;
      sessionStorage.setItem('slideIn', dx<0 ? 'from-right' : 'from-left');
      setT(dx<0 ? -w : w, true);
      setTimeout(function(){ location.href=target; }, 280);
    } else if(moved){
      setT(0,true); setTimeout(function(){ app.style.transition='none'; app.style.transform='none'; }, 300);
    }
  }, {passive:true});
})();
</script>
</body></html>
